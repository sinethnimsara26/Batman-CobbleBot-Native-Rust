name: b05-original-bank-street-source-1x

on:
  push:
    branches:
      - revive/level2-b05-bank-street-source-1x-2026-11-11
    paths:
      - reverse-engineering/tools/b05_bake_bank_street_1x.py
      - reverse-engineering/tools/bake_level_tiles.py
      - reverse-engineering/tools/b03_bake_stage_asset_proofs.py
      - reverse-engineering/tools/bake_level_tiles.py
      - .github/workflows/b05-original-bank-street-source-1x.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: b05-original-bank-street-source-1x
  cancel-in-progress: true

jobs:
  source-bank-street-1x:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Install offline-only Pillow original source rasterizer
        shell: pwsh
        run: python -m pip install --disable-pip-version-check "Pillow>=11,<15"

      - name: Re-download canonical original FWS and SHA-verify exact bytes
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://archive.org/download/the-batman-cobblebot-caper/The%20Batman%20-%20The%20Cobblebot%20Caper.swf"
          for ($attempt = 1; $attempt -le 4; $attempt++) {
            try {
              Invoke-WebRequest -Uri $url -OutFile ".original-b05-download.swf" -ErrorAction Stop
              break
            } catch {
              if ($attempt -eq 4) { throw }
              Start-Sleep -Seconds (5 * $attempt)
            }
          }
          @'
          import hashlib,zlib
          from pathlib import Path
          src=Path(".original-b05-download.swf").read_bytes()
          if src[:3]==b"CWS":
              fws=b"FWS"+src[3:8]+zlib.decompress(src[8:])
          elif src[:3]==b"FWS":
              fws=src
          else:
              raise SystemExit(f"Unexpected SWF header: {src[:3]!r}")
          sha=hashlib.sha256(fws).hexdigest()
          expect="3d9e1992404313bc2e2652d46a5838160ef721e2ad559fdd7455f3c54f8ac1ed"
          if sha!=expect or len(fws)!=2819100:
              raise SystemExit(f"Non-canonical original source: {sha}, {len(fws)}")
          out=Path(".generated/b05input/canonical_original.swf")
          out.parent.mkdir(parents=True,exist_ok=True)
          out.write_bytes(fws)
          print("B05_CANONICAL_ORIGINAL_FWS_PASS",sha,len(fws))
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw "Canonical original source verification FAILED" }

      - name: Extract original source vector/sprite frames and bitmaps
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tools = "reverse-engineering/tools"
          $swf = ".generated/b05input/canonical_original.swf"
          New-Item -ItemType Directory -Force ".generated/b05input/reports",".generated/b05input/bitmaps" | Out-Null
          python "$tools/swf_re.py" "$swf" ".generated/b05input/reports"
          if ($LASTEXITCODE -ne 0) { throw "Original sprite extraction FAILED" }
          python "$tools/extract_bitmaps.py" "$swf" ".generated/b05input/bitmaps"
          if ($LASTEXITCODE -ne 0) { throw "Original bitmap extraction FAILED" }

      - name: Bake and independently verify original Bank street static 1x scene views
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tools = "reverse-engineering/tools"
          python "$tools/b05_bake_bank_street_1x.py" --swf ".generated/b05input/canonical_original.swf" --symbols ".generated/b05input/reports/symbols.json" --bitmaps ".generated/b05input/bitmaps" --instances "reverse-engineering/manifests/level-instances.json" --spec "reverse-engineering/manifests/level-spec.json" --out ".generated/b05-bank-source-1x"
          if ($LASTEXITCODE -ne 0) { throw "B05 source bank-street 1x proof FAILED" }

      - name: Upload development-only 1x Bank street source proof (no SWF/native pack)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: B05-CobbleBot-Original-Bank-Street-Source-1x-Proofs
          path: .generated/b05-bank-source-1x/
          if-no-files-found: warn
          retention-days: 30
