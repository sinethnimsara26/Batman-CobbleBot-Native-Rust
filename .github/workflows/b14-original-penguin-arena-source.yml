name: b14-original-penguin-arena-source

on:
  push:
    branches:
      - revive/level2-b14-penguin-arena-2026-11-12
    paths:
      - reverse-engineering/tools/b14_bake_penguin_arena.py
      - src/collision.rs
      - src/stage.rs
      - src/penguin.rs
      - .github/workflows/b14-original-penguin-arena-source.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: b14-original-penguin-arena
  cancel-in-progress: true

jobs:
  source-penguin-arena:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install development-only Pillow source rasterizer
        shell: pwsh
        run: python -m pip install --disable-pip-version-check "Pillow>=11,<15"

      - name: Download and strictly SHA-verify original canonical SWF
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://archive.org/download/the-batman-cobblebot-caper/The%20Batman%20-%20The%20Cobblebot%20Caper.swf"
          for ($attempt = 1; $attempt -le 4; $attempt++) {
            try {
              Invoke-WebRequest -Uri $url -OutFile ".original-b14-download.swf" -ErrorAction Stop
              break
            } catch {
              if ($attempt -eq 4) { throw }
              Start-Sleep -Seconds (5 * $attempt)
            }
          }
          @'
          import hashlib, zlib
          from pathlib import Path
          src = Path(".original-b14-download.swf").read_bytes()
          if src[:3] == b"CWS":
              fws = b"FWS" + src[3:8] + zlib.decompress(src[8:])
          elif src[:3] == b"FWS":
              fws = src
          else:
              raise SystemExit(f"Invalid SWF header: {src[:3]!r}")
          sha = hashlib.sha256(fws).hexdigest()
          if sha != "3d9e1992404313bc2e2652d46a5838160ef721e2ad559fdd7455f3c54f8ac1ed" or len(fws) != 2819100:
              raise SystemExit(f"Wrong original source {sha}, length {len(fws)}")
          out = Path(".generated/b14input/canonical_original.swf")
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_bytes(fws)
          print("B14_CANONICAL_ORIGINAL_FWS_PASS", sha, len(fws))
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw "Original canonical source verification FAILED" }

      - name: Extract original symbols, bitmaps, and Level 1C #1094 collision mask
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tools = "reverse-engineering/tools"
          $swf = ".generated/b14input/canonical_original.swf"
          New-Item -ItemType Directory -Force ".generated/b14input/reports",".generated/b14input/bitmaps",".generated/b14input/masks" | Out-Null
          python "$tools/swf_re.py" "$swf" ".generated/b14input/reports"
          if ($LASTEXITCODE -ne 0) { throw "Original symbol extraction failed" }
          python "$tools/extract_bitmaps.py" "$swf" ".generated/b14input/bitmaps"
          if ($LASTEXITCODE -ne 0) { throw "Original bitmap extraction failed" }
          python "$tools/render_collision_masks.py" "$swf" ".generated/b14input/reports/symbols.json" "reverse-engineering/manifests/level-instances.json" ".generated/b14input/masks" --level level1c_penguin
          if ($LASTEXITCODE -ne 0) { throw "Level 1C collision mask extraction failed" }

      - name: Verify root21 stage, #1094 ground, #1095 arena 1x + HQ3x proofs, and #1250 timeline
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python reverse-engineering/tools/b14_bake_penguin_arena.py `
            --swf ".generated/b14input/canonical_original.swf" `
            --symbols ".generated/b14input/reports/symbols.json" `
            --bitmaps ".generated/b14input/bitmaps" `
            --instances "reverse-engineering/manifests/level-instances.json" `
            --mask-manifest ".generated/b14input/masks/manifest.json" `
            --mask-png ".generated/b14input/masks/level1c_penguin_ground.png" `
            --out ".generated/b14-penguin-arena-source"
          if ($LASTEXITCODE -ne 0) { throw "B14 Level 1C Penguin Arena source proof failed" }

      - name: Upload B14 Level 1C Penguin Arena source proofs (no full SWF)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: B14-CobbleBot-Original-Penguin-Arena-Source-Proofs
          path: .generated/b14-penguin-arena-source/
          if-no-files-found: warn
          retention-days: 30
