          import json,struct
          from pathlib import Path

          packer=Path("reverse-engineering/tools/pack_sprite_frames.py").read_text()
          assets=Path("src/assets.rs").read_text()
          required_packer=[
              'MAGIC_V1 = b"BCBFRM01"',
              'MAGIC_V2 = b"BCBFRM02"',
              '"--format-version"',
              '"--logical-pixel-scale"',
              'struct.pack("<f", args.logical_pixel_scale)',
          ]
          required_assets=[
              "pub struct SpriteSet",
              "pub logical_pixel_scale: f32",
              'b"BCBFRM01"',
              'b"BCBFRM02"',
              "decode_sprite_frames_expected",
              "sprite pack scale mismatch",
          ]
          missing=[x for x in required_packer if x not in packer]
          missing += [x for x in required_assets if x not in assets]
          if missing:
              raise SystemExit(f"Round 4 source contract missing: {missing}")

          def inspect(path):
              data=Path(path).read_bytes()
              magic=data[:8].decode("ascii")
              count=struct.unpack_from("<I",data,8)[0]
              scale=1.0 if magic=="BCBFRM01" else struct.unpack_from("<f",data,12)[0]
              return magic,count,scale

          # Real runtime packs intentionally exercise both versions.
          batman=inspect("assets/batman_frames.bin")
          pickup=inspect("assets/pickup_frames.bin")
          legacy=inspect("assets/batarang_frames.bin")
          probe=inspect("assets/scale_probe.bin")
          print("Batman pack:",batman)
          print("Pickup pack:",pickup)
          print("Legacy Batarang pack:",legacy)
          print("3x scale probe:",probe)

          assert batman == ("BCBFRM02",279,1.0), batman
          assert pickup[0]=="BCBFRM02" and pickup[2]==1.0, pickup
          assert legacy[0]=="BCBFRM01" and legacy[2]==1.0, legacy
          assert probe[0]=="BCBFRM02" and probe[2]==3.0, probe

          # Sidecars must carry exactly the same scale metadata.
          for name,expected_format,expected_scale in [
              ("batman_frames","BCBFRM02",1.0),
              ("pickup_frames","BCBFRM02",1.0),
              ("batarang_frames","BCBFRM01",1.0),
              ("scale_probe","BCBFRM02",3.0),
          ]:
              meta=json.loads(Path(f"assets/{name}.json").read_text())
              assert meta["format"]==expected_format,(name,meta)
              assert abs(meta["logical_pixel_scale"]-expected_scale)<1e-6,(name,meta)

          print("Round 4 pack contract OK: v1 compatibility + v2 explicit scale metadata.")

