          assert abs(hq["scale"][1]-legacy["scale"][1]*3.0) < 1e-9
          for hv,lv in zip(hq["anchor_in_bitmap"],legacy["anchor_in_bitmap"]):
              assert abs(hv-lv*3.0) < 1e-5, (legacy["anchor_in_bitmap"],hq["anchor_in_bitmap"])

          data=Path("assets/batman_frames_hq.bin").read_bytes()
          assert data[:8] == b"BCBFRM02"
          assert struct.unpack_from("<I",data,8)[0] == 279
          assert abs(struct.unpack_from("<f",data,12)[0]-3.0) < 1e-6

          assets=Path("src/assets.rs").read_text()
          render=Path("src/render.rs").read_text()
          baker=Path("reverse-engineering/tools/bake_player_states.py").read_text()
