          assert "blit_region_hq3" not in foreground
          for needle in ('convert("RGBa")',"Image.Resampling.LANCZOS","hq_finalize"):
              assert needle in finalizer, needle
          workflow=Path(".github/workflows/build-level1a-fidelity.yml").read_text()
          for symbol in ("746","747","34","737"):
              needle=f"--symbol {symbol} --scale 6.0 --all-frames --clip-stage-width 600 --clip-stage-height 400"
              assert needle in workflow, needle
          baker=Path("reverse-engineering/tools/bake_sprite_frames.py").read_text()
          for needle in ("--clip-stage-width","--clip-stage-height","stage_clip"):
              assert needle in baker, needle

          report["legacy_overlay_lazy_cache_upper_bound_rgba_bytes"]=legacy_cache_upper
          report["hq_overlay_lazy_cache_upper_bound_rgba_bytes"]=hq_cache_upper
          report["all_overlay_lazy_cache_upper_bound_rgba_bytes"]=legacy_cache_upper+hq_cache_upper
          # Include both legacy+HQ Batman eager packs and both legacy+HQ overlay
