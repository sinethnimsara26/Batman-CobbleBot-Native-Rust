name: build-level1a-fidelity

on:
  push:
    branches: [main, level1a-cxform-fidelity, hq-rendering-phase1-halftone, hq-rendering-phase2-surfaces, hq-rendering-phase3-3x-surface, hq-rendering-phase4-pack-v2, hq-rendering-phase5-batman-3x, hq-rendering-phase6-hud-3x]
  workflow_dispatch:

concurrency:
  group: batman-level1a-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Python asset dependency
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Fetch and verify canonical CobbleBot SWF
        shell: pwsh
        run: |
          $url = "https://archive.org/download/the-batman-cobblebot-caper/The%20Batman%20-%20The%20Cobblebot%20Caper.swf"
          Invoke-WebRequest -Uri $url -OutFile cobblebot-source.swf
          @'
          import hashlib, zlib
          from pathlib import Path
          src=Path("cobblebot-source.swf").read_bytes()
          if src[:3] == b"CWS":
              fws=b"FWS"+src[3:8]+zlib.decompress(src[8:])
          elif src[:3] == b"FWS":
              fws=src
          else:
              raise SystemExit(f"bad SWF signature {src[:3]!r}")
          expected="3d9e1992404313bc2e2652d46a5838160ef721e2ad559fdd7455f3c54f8ac1ed"
          got=hashlib.sha256(fws).hexdigest()
          print("canonical FWS SHA-256:",got)
          if got != expected:
              raise SystemExit(f"source mismatch: {got}")
          out=Path(".generated")
          out.mkdir(parents=True,exist_ok=True)
          (out/"cobblebot.swf").write_bytes(fws)
          '@ | python -

      - name: Rebuild original Level 1A assets from SWF
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $tools = "reverse-engineering/tools"
          $work = ".generated"
          $swf = "$work/cobblebot.swf"
          New-Item -ItemType Directory -Force -Path "$work/reports","$work/bitmaps","$work/sounds","$work/batman-frames","$work/batman-frames-hq","$work/pickup-frames","$work/batarang-frames","$work/level-title","$work/fadein","$work/fadeout","$work/tutorial-overlay","$work/hud","$work/hud-hq-super","$work/hud-hq-final","$work/level1a-tiles","assets","reverse-engineering/generated/collision_masks" | Out-Null

          python "$tools/swf_re.py" "$swf" "$work/reports"
          @'
          import json
          from pathlib import Path

          symbols=json.loads(Path(".generated/reports/symbols.json").read_text())
          root_placements=json.loads(Path(".generated/reports/root_placements.json").read_text())
          def frame0(sid):
              s=symbols.get(str(sid))
              if s is None:
                  return {"symbol":sid,"kind":"static_definition"}
              return {
                  "symbol":sid,
                  "frames":s.get("frames"),
                  "labels":s.get("labels",[]),
                  "placements":[p for p in s.get("placements",[]) if p.get("frame",0)==0],
              }
          # Include the game clip, background clip, and first visible-level clip.
          report={
              "root_frame_19":[p for p in root_placements if p.get("frame",0)<=19],
              "symbols":{str(sid):frame0(sid) for sid in (131,134,696,142,152)},
          }
          Path(".generated/background-tree.json").write_text(json.dumps(report,indent=2))
          actions=json.loads(Path(".generated/reports/actions.json").read_text())
          title_actions=[
              block for block in actions
              if "746" in str(block.get("context",""))
              or any("levelTitle" in str(x) or "visible" in str(x) or "_alpha" in str(x)
                     for x in block.get("strings",[]))
          ]
          Path(".generated/title-actions.json").write_text(json.dumps(title_actions,indent=2))
          print("Level-title related action blocks:")
          print(json.dumps(title_actions,indent=2))
          print("Level 1A background tree:")
          print(json.dumps(report,indent=2))
          '@ | python -
          python "$tools/extract_bitmaps.py" "$swf" "$work/bitmaps"
          python "$tools/extract_sounds.py" "$swf" "$work/sounds"
          Copy-Item "$work/sounds/0751_sound_0751.mp3" "assets/level1a_music.mp3"
          Copy-Item "$work/sounds/0248_sound_0248.mp3" "assets/jump.mp3"
          Copy-Item "$work/sounds/0004_item.mp3" "assets/item.mp3"
          python "$tools/stage_ui_screens.py" "$work/bitmaps" "assets"

          python "$tools/render_collision_masks.py" "$swf" "$work/reports/symbols.json" "reverse-engineering/manifests/level-instances.json" "reverse-engineering/generated/collision_masks" --level level1a

          # Preserve the exact 1x player pack as the legacy regression oracle.
          python "$tools/bake_player_states.py" "$swf" "$work/reports/symbols.json" "$work/batman-frames" --bitmaps "$work/bitmaps" --symbol 691 --scale 0.163742
          python "$tools/pack_sprite_frames.py" "$work/batman-frames" "assets/batman_frames.bin" --format-version 2 --logical-pixel-scale 1.0

          # Round 5: rerasterize the same 279 true child frames at final 3x,
          # first at 6x (3x output * 2x supersample), then premultiplied-alpha
          # Lanczos downsample to the final 3x pack.
          python "$tools/bake_player_states.py" "$swf" "$work/reports/symbols.json" "$work/batman-frames-hq" --bitmaps "$work/bitmaps" --symbol 691 --scale 0.163742 --output-scale 3 --supersample 2 --downsample lanczos
          python "$tools/pack_sprite_frames.py" "$work/batman-frames-hq" "assets/batman_frames_hq.bin" --format-version 2 --logical-pixel-scale 3.0

          python "$tools/extract_player_sound_events.py" "$swf" "$work/reports/symbols.json" "$work/batman-frames/manifest.json" "reverse-engineering/manifests/sound-manifest.json" "$work/player_sound_events.json"

          python "$tools/bake_sprite_frames.py" "$swf" "$work/reports/symbols.json" "$work/pickup-frames" --bitmaps "$work/bitmaps" --symbol 695 --scale 1.130691 --all-frames
          python "$tools/pack_sprite_frames.py" "$work/pickup-frames" "assets/pickup_frames.bin"
          python "$tools/bake_sprite_frames.py" "$swf" "$work/reports/symbols.json" "$work/batarang-frames" --bitmaps "$work/bitmaps" --symbol 694 --scale 0.364471 --all-frames
          python "$tools/pack_sprite_frames.py" "$work/batarang-frames" "assets/batarang_frames.bin" --format-version 1
          python "$tools/pack_sprite_frames.py" "$work/batarang-frames" "assets/scale_probe.bin" --format-version 2 --logical-pixel-scale 3.0

          # Root gameplay frame 19 has two backdrop layers below game:
          # depth 1 = character 131, depth 2 = character 134 at (300,130)
          # scaled 0.769348. Preserve both; omitting them leaves a black sky.
          python "$tools/bake_sprite_frames.py" "$swf" "$work/reports/symbols.json" "assets/root_bg_131.png" --bitmaps "$work/bitmaps" --symbol 131 --frame 0 --scale 1.0 --native-bounds
          python "$tools/bake_sprite_frames.py" "$swf" "$work/reports/symbols.json" "assets/root_bg_134.png" --bitmaps "$work/bitmaps" --symbol 134 --frame 0 --scale 1.0 --native-bounds

          python "$tools/bake_sprite_frames.py" "$swf" "$work/reports/symbols.json" "assets/level1a_bg.png" --bitmaps "$work/bitmaps" --symbol 142 --frame 0 --scale 1.0 --native-bounds

          python "$tools/bake_sprite_frames.py" "$swf" "$work/reports/symbols.json" "$work/level-title" --bitmaps "$work/bitmaps" --symbol 746 --scale 1.0 --all-frames
          python "$tools/pack_sprite_frames.py" "$work/level-title" "assets/level_title_frames.bin"
          python "$tools/bake_sprite_frames.py" "$swf" "$work/reports/symbols.json" "$work/fadein" --bitmaps "$work/bitmaps" --symbol 747 --scale 1.0 --all-frames
          python "$tools/pack_sprite_frames.py" "$work/fadein" "assets/fadein_frames.bin"
          python "$tools/bake_sprite_frames.py" "$swf" "$work/reports/symbols.json" "$work/fadeout" --bitmaps "$work/bitmaps" --symbol 34 --scale 1.0 --all-frames
          python "$tools/pack_sprite_frames.py" "$work/fadeout" "assets/fadeout_frames.bin"

          python "$tools/bake_sprite_frames.py" "$swf" "$work/reports/symbols.json" "$work/tutorial-overlay" --bitmaps "$work/bitmaps" --symbol 737 --scale 1.0 --all-frames
          python "$tools/pack_sprite_frames.py" "$work/tutorial-overlay" "assets/tutorial_overlay_frames.bin"

          # Original HUD shell (symbol 716). Flash _sans resolves to Arial on
          # Windows; bake only the static labels and numeric atlases. Rust owns
          # the changing Batarang/Score/Lives values at runtime.
          python "$tools/bake_sprite_frames.py" "$swf" "$work/reports/symbols.json" "$work/hud" --bitmaps "$work/bitmaps" --symbol 716 --scale 1.0 --all-frames
          python "$tools/bake_hud_assets.py" "$swf" "$work/reports/symbols.json" "$work/hud" "assets" --font "C:/Windows/Fonts/arial.ttf"

          # Round 6: rasterize HUD vector/device-font content at 6x, then
          # premultiplied-alpha Lanczos downsample to the final true 3x assets.
          python "$tools/bake_sprite_frames.py" "$swf" "$work/reports/symbols.json" "$work/hud-hq-super" --bitmaps "$work/bitmaps" --symbol 716 --scale 6.0 --all-frames
          python "$tools/bake_hud_assets.py" "$swf" "$work/reports/symbols.json" "$work/hud-hq-super" "assets" --font "C:/Windows/Fonts/arial.ttf" --output-scale 3 --supersample 2 --downsample lanczos --suffix "_hq" --pack-dir "$work/hud-hq-final"
          python "$tools/pack_sprite_frames.py" "$work/hud-hq-final" "assets/hud_shell_hq.bin" --format-version 2 --logical-pixel-scale 3.0
          python "$tools/bake_level_tiles.py" "$swf" "$work/reports/symbols.json" "$work/level1a-tiles" --bitmaps "$work/bitmaps" --symbol 152 --place-x 2467.65 --place-y 239.25 --exclude-symbol 149 --exclude-symbol 151 --exclude-symbol 153
          python "$tools/pack_level_tiles.py" "$work/level1a-tiles" "assets/level1a_tiles.bin"

      - name: Validate recovered assets and reject leaked control geometry
        shell: python
        run: |
          import json
          from pathlib import Path
          from PIL import Image

          sounds=json.loads(Path(".generated/sounds/manifest.json").read_text())
          byid={x["id"]:x for x in sounds}
          expected_sounds={
              4:("item","mp3",1961),
              248:("sound_0248","mp3",5482),
              751:("sound_0751","mp3",83335),
          }
          for sid,(name,fmt,samples) in expected_sounds.items():
              rec=byid[sid]
              assert rec["export_name"]==name,rec
              assert rec["format_name"]==fmt,rec
              assert rec["sample_count"]==samples,rec
          print("Level 1A sound assets:",{sid:byid[sid]["file"] for sid in expected_sounds})

          player_audio=json.loads(Path(".generated/player_sound_events.json").read_text())
          nonempty=[x for x in player_audio if x["events"]]
          assert nonempty == [{
              "name":"jump","child_symbol":262,
              "events":[{"frame":1,"sound_id":248,"name":"sound_0248"}]
          }],nonempty

          # Root frame 19 starts the Level 1A loop: sound 751, loopCount 32767.
          import struct,sys
          sys.path.insert(0,"reverse-engineering/tools")
          from swf_re import read_rect,tags
          swf=Path(".generated/cobblebot.swf").read_bytes()
          _,p=read_rect(swf,8);p+=4
          frame=0;root_event=None
          for code,payload,_,_ in tags(swf,p,len(swf)):
              if code==1: frame+=1
              elif code==15 and frame==19:
                  sid=struct.unpack_from("<H",payload,0)[0]
                  flags=payload[2]
                  q=3
                  if flags&1:q+=4
                  if flags&2:q+=4
                  loops=struct.unpack_from("<H",payload,q)[0] if flags&4 else 1
                  root_event=(sid,loops)
                  break
          assert root_event==(751,32767),root_event

          player=json.loads(Path(".generated/batman-frames/manifest.json").read_text())
          symbols=json.loads(Path(".generated/reports/symbols.json").read_text())
          relevant=(142,716,737,746,169,242)
          cxform_counts={sid:sum("cxform" in p for p in symbols[str(sid)]["placements"])
                         for sid in relevant}
          print("Recovered CXFORMWITHALPHA placements:",cxform_counts)
          assert cxform_counts == {142:56,716:1,737:7,746:21,169:1,242:19}, cxform_counts
          for sid in relevant:
              for placement in symbols[str(sid)]["placements"]:
                  if placement.get("flags",0)&0x08:
                      assert set(placement["cxform"]) == {"mult","add"}, placement
                      assert len(placement["cxform"]["mult"]) == 4, placement
                      assert len(placement["cxform"]["add"]) == 4, placement
          expected=[
              ("stand",9),("walk",12),("run",10),("jump",4),("fall",5),("glide",2),
              ("land",2),("duck",5),("up",2),("punch",11),("highpunch",11),
              ("lowpunch",9),("jumppunch",9),("kick",8),("highkick",8),
              ("lowkick",15),("jumpkick",10),("batarang",9),("duckbatarang",12),
              ("jumpbatarang",7),("grapplingup",10),("grappling",28),
              ("capespin",9),("hurt2",17),("hurt",11),("electro",21),("die",23),
          ]
          actual=[(x["name"],x["frame_count"]) for x in player["states"]]
          print("Batman child timelines:",actual,"total",player["frame_count"])
          assert player["frame_count"] == 279
          assert actual == expected
          assert player["unsupported_fills"] == []
          assert player["missing_bitmap_ids"] == []

          tutorial=json.loads(Path(".generated/tutorial-overlay/manifest.json").read_text())
          assert tutorial["frame_count"] == 149
          assert tutorial["unsupported_fills"] == []
          # The generic sprite baker now renders every embedded DefineText
          # record using the SWF's own embedded font glyphs.
          assert tutorial["missing_bitmap_ids"] == [], tutorial["missing_bitmap_ids"]

          hud=json.loads(Path("assets/hud.json").read_text())
          print("HUD:",hud)
          assert hud["hud_size"] == [283,86], hud["hud_size"]
          assert hud["variables"] == {"702":"_root.batarangs","713":"_root.score","714":"_root.lives"}, hud["variables"]
          assert hud["static_text"] == {"700":"BATARANG","710":"HEALTH","711":"SCORE","715":"lives x"}, hud["static_text"]

          # Image-level gates for the placement color transforms. The HUD's
          # panel is intentionally translucent (alpha multiplier 82/256), and
          # the level-title clip fades through exact 204/153/102/51 steps.
          # These checks prevent a parser that merely records CXFORM values
          # without applying them from passing CI.
          with Image.open("assets/hud_base.png") as im:
              alpha=im.convert("RGBA").getchannel("A")
              hist=alpha.histogram()
              partial=sum(hist[1:255])
              print("HUD partial-alpha pixels:",partial)
              assert partial > 10000, partial
          for frame,expected in [(44,204),(45,153),(46,102),(47,51),(50,51)]:
              with Image.open(Path(".generated/level-title")/f"{frame:03}.png") as im:
                  maximum=im.convert("RGBA").getchannel("A").getextrema()[1]
                  assert maximum == expected, (frame,maximum,expected)

          for name,count in [("level-title",100),("fadein",43),("fadeout",41)]:
              ui=json.loads(Path(f".generated/{name}/manifest.json").read_text())
              assert ui["frame_count"] == count
              assert ui["unsupported_fills"] == []
              assert ui["missing_bitmap_ids"] == []

          root=Path(".generated/level1a-tiles")
          manifest=json.loads((root/"manifest.json").read_text())
          assert manifest["excluded_symbols"] == [149,151,153]
          assert manifest["unsupported_fills"] == []

          total=red=blue=0
          for item in manifest["tiles"]:
              with Image.open(root/item["file"]) as im:
                  for r,g,b,a in im.convert("RGBA").getdata():
                      if a < 16:
                          continue
                      total += 1
                      red += int(r > 160 and g < 80 and b < 80)
                      blue += int(b > 120 and r < 90 and g < 120)
          red_ratio=red/max(1,total)
          blue_ratio=blue/max(1,total)
          print("visible pixels",total,"red ratio",red_ratio,"blue ratio",blue_ratio)
          if red_ratio > 0.005 or blue_ratio > 0.001:
              raise SystemExit("control geometry leaked into visible Level 1A tiles")

      - name: Validate Round 1 presentation contract
        shell: python
        run: |
          from pathlib import Path
          src=Path("src/win32.rs").read_text()
          required=[
              "const HALFTONE:i32=4",
              "SetStretchBltMode(hdc,HALFTONE)",
              "SetBrushOrgEx(hdc,0,0,null_mut())",
              "RenderSurface::new(LOGICAL_W,LOGICAL_H)",
              "biWidth:app.fb.w as i32",
              "biHeight:-(app.fb.h as i32)",
          ]
          missing=[x for x in required if x not in src]
          if missing:
              raise SystemExit(f"Round 1 presenter contract missing: {missing}")
          # Phase 1 behavior survives the Phase 2 abstraction: the active
          # legacy surface is still exactly the original logical 600x400.
          print("Round 1 contract OK: HALFTONE retained; legacy surface remains LOGICAL_W x LOGICAL_H.")

      - name: Validate Round 2 surface abstraction contract
        shell: python
        run: |
          from pathlib import Path
          surface=Path("src/surface.rs").read_text()
          render=Path("src/render.rs").read_text()
          win32=Path("src/win32.rs").read_text()
          headless=Path("src/headless.rs").read_text()
          required={
              "surface":[
                  "pub struct RenderSurface",
                  "pub w: usize",
                  "pub h: usize",
                  "pub pixels: Vec<u32>",
                  "pub fn byte_len(&self)",
              ],
              "render":[
                  "pub enum RenderMode{Legacy1x,HighQuality}",
                  "pub struct RenderConfig",
                  "pub fn render_with_config",
                  "RenderMode::Legacy1x",
                  "dst.pixels[dy as usize*dst.w+dx as usize]",
              ],
              "win32":[
                  "fb:RenderSurface",
                  "RenderSurface::new(LOGICAL_W,LOGICAL_H)",
                  "biWidth:app.fb.w as i32",
                  "app.fb.pixels.as_ptr()",
              ],
              "headless":[
                  "RenderSurface::new(LOGICAL_W,LOGICAL_H)",
                  "fb.w as u32,fb.h as u32",
                  "for &px in &fb.pixels",
              ],
          }
          texts={"surface":surface,"render":render,"win32":win32,"headless":headless}
          missing={name:[needle for needle in needles if needle not in texts[name]]
                   for name,needles in required.items()}
          missing={k:v for k,v in missing.items() if v}
          if missing:
              raise SystemExit(f"Round 2 surface contract missing: {missing}")
          print("Round 2 contract OK: render target dimensions/stride are explicit; gameplay stays logical.")

      - name: Validate Round 3 HQ surface contract
        shell: python
        run: |
          from pathlib import Path
          render=Path("src/render.rs").read_text()
          win32=Path("src/win32.rs").read_text()
          headless=Path("src/headless.rs").read_text()
          main=Path("src/main.rs").read_text()
          required={
              "render":[
                  "pub const HQ_SCALE:usize=3",
                  "pub const HQ_W:usize=LOGICAL_W*HQ_SCALE",
                  "pub const HQ_H:usize=LOGICAL_H*HQ_SCALE",
                  "pub const fn high_quality()",
                  "pub fn render_high_quality",
                  "pub fn upscale_opaque_base",
                  "pixel (3*x+1,3*y+1)",
              ],
              "win32":[
                  "base_fb:RenderSurface",
                  "fb:RenderSurface",
                  "RenderSurface::new(LOGICAL_W,LOGICAL_H)",
                  "RenderSurface::new(render::HQ_W,render::HQ_H)",
                  "render::render_high_quality",
              ],
              "headless":[
                  "pub fn render_smoke_hq",
                  "pub fn benchmark_render",
                  "RenderSurface::new(render::HQ_W,render::HQ_H)",
              ],
              "main":[
                  "--render-smoke-hq",
                  "--benchmark-render",
              ],
          }
          texts={"render":render,"win32":win32,"headless":headless,"main":main}
          missing={name:[needle for needle in needles if needle not in texts[name]]
                   for name,needles in required.items()}
          missing={k:v for k,v in missing.items() if v}
          if missing:
              raise SystemExit(f"Round 3 HQ contract missing: {missing}")
          print("Round 3 contract OK: 600x400 logical + 1800x1200 HQ presentation path is wired.")

      - name: Validate Round 4 sprite-pack format contract
        shell: python
        run: |
          import json,struct
          from pathlib import Path

          packer=Path("reverse-engineering/tools/pack_sprite_frames.py").read_text()
          assets=Path("src/assets.rs").read_text()
          required_packer=[
              'MAGIC_V1 = b"BCBFRM01"',
              'MAGIC_V2 = b"BCBFRM02"',
              '"--format-version"',
              '"--logical-pixel-scale"',
              'struct.pack("<f", args.logical_pixel_scale)',
          ]
          required_assets=[
              "pub struct SpriteSet",
              "pub logical_pixel_scale: f32",
              'b"BCBFRM01"',
              'b"BCBFRM02"',
              "decode_sprite_frames_expected",
              "sprite pack scale mismatch",
          ]
          missing=[x for x in required_packer if x not in packer]
          missing += [x for x in required_assets if x not in assets]
          if missing:
              raise SystemExit(f"Round 4 source contract missing: {missing}")

          def inspect(path):
              data=Path(path).read_bytes()
              magic=data[:8].decode("ascii")
              count=struct.unpack_from("<I",data,8)[0]
              scale=1.0 if magic=="BCBFRM01" else struct.unpack_from("<f",data,12)[0]
              return magic,count,scale

          # Real runtime packs intentionally exercise both versions.
          batman=inspect("assets/batman_frames.bin")
          pickup=inspect("assets/pickup_frames.bin")
          legacy=inspect("assets/batarang_frames.bin")
          probe=inspect("assets/scale_probe.bin")
          print("Batman pack:",batman)
          print("Pickup pack:",pickup)
          print("Legacy Batarang pack:",legacy)
          print("3x scale probe:",probe)

          assert batman == ("BCBFRM02",279,1.0), batman
          assert pickup[0]=="BCBFRM02" and pickup[2]==1.0, pickup
          assert legacy[0]=="BCBFRM01" and legacy[2]==1.0, legacy
          assert probe[0]=="BCBFRM02" and probe[2]==3.0, probe

          # Sidecars must carry exactly the same scale metadata.
          for name,expected_format,expected_scale in [
              ("batman_frames","BCBFRM02",1.0),
              ("pickup_frames","BCBFRM02",1.0),
              ("batarang_frames","BCBFRM01",1.0),
              ("scale_probe","BCBFRM02",3.0),
          ]:
              meta=json.loads(Path(f"assets/{name}.json").read_text())
              assert meta["format"]==expected_format,(name,meta)
              assert abs(meta["logical_pixel_scale"]-expected_scale)<1e-6,(name,meta)

          print("Round 4 pack contract OK: v1 compatibility + v2 explicit scale metadata.")

      - name: Validate Round 5 true-3x Batman contract
        shell: python
        run: |
          import json,struct
          from pathlib import Path
          from PIL import Image

          legacy=json.loads(Path(".generated/batman-frames/manifest.json").read_text())
          hq=json.loads(Path(".generated/batman-frames-hq/manifest.json").read_text())

          assert legacy["frame_count"] == hq["frame_count"] == 279
          legacy_states=[(x["name"],x["frame_count"],x["start"],x["end"]) for x in legacy["states"]]
          hq_states=[(x["name"],x["frame_count"],x["start"],x["end"]) for x in hq["states"]]
          assert hq_states == legacy_states
          assert legacy["unsupported_fills"] == hq["unsupported_fills"] == []
          assert legacy["missing_bitmap_ids"] == hq["missing_bitmap_ids"] == []

          assert legacy["output_scale"] == 1 and legacy["supersample"] == 1
          assert hq["output_scale"] == 3, hq
          assert hq["supersample"] == 2, hq
          assert hq["downsample"] == "lanczos", hq
          assert abs(hq["base_scale"]-legacy["base_scale"]) < 1e-12
          assert abs(hq["scale"][0]-legacy["scale"][0]*3.0) < 1e-9
          assert abs(hq["scale"][1]-legacy["scale"][1]*3.0) < 1e-9
          for hv,lv in zip(hq["anchor_in_bitmap"],legacy["anchor_in_bitmap"]):
              assert abs(hv-lv*3.0) < 1e-5, (legacy["anchor_in_bitmap"],hq["anchor_in_bitmap"])

          data=Path("assets/batman_frames_hq.bin").read_bytes()
          assert data[:8] == b"BCBFRM02"
          assert struct.unpack_from("<I",data,8)[0] == 279
          assert abs(struct.unpack_from("<f",data,12)[0]-3.0) < 1e-6

          assets=Path("src/assets.rs").read_text()
          render=Path("src/render.rs").read_text()
          baker=Path("reverse-engineering/tools/bake_player_states.py").read_text()
          for needle in (
              '"--output-scale"','"--supersample"','"--downsample"',
              'convert("RGBa").resize',
          ):
              assert needle in baker, needle
          for needle in (
              "batman_frames_hq: SpriteSet",
              'decode_sprite_frames_expected(include_bytes!("../assets/batman_frames_hq.bin"),3.0',
          ):
              assert needle in assets, needle
          for needle in (
              "draw_batman_hq",
              "render_world_legacy(base,game,assets)",
              "draw_foreground_hq(target,game,assets)",
              "True HQ frames are already at final presentation resolution",
          ):
              assert needle in render, needle

          # The baker intentionally uses a common full canvas so all frames
          # share one stable origin while rasterizing. pack_sprite_frames.py
          # then alpha-crops every PNG and rewrites each frame's anchor. Rust
          # decodes those CROPPED records, so the runtime budget must be based
          # on the pack sidecars rather than temporary .generated canvases.
          legacy_pack=json.loads(Path("assets/batman_frames.json").read_text())
          hq_pack=json.loads(Path("assets/batman_frames_hq.json").read_text())
          def packed_decoded_bytes(sidecar):
              return sum(frame["size"][0]*frame["size"][1]*4 for frame in sidecar["frames"])

          report={
              "legacy_pack_bytes":Path("assets/batman_frames.bin").stat().st_size,
              "hq_pack_bytes":Path("assets/batman_frames_hq.bin").stat().st_size,
              "legacy_runtime_decoded_rgba_bytes":packed_decoded_bytes(legacy_pack),
              "hq_runtime_decoded_rgba_bytes":packed_decoded_bytes(hq_pack),
              "legacy_bake_canvas":legacy["size"],
              "hq_bake_canvas":hq["size"],
              "frames":279,
              "output_scale":3,
              "supersample":2,
              "downsample":"lanczos",
          }
          runtime_total=report["legacy_runtime_decoded_rgba_bytes"]+report["hq_runtime_decoded_rgba_bytes"]
          report["combined_runtime_decoded_rgba_bytes"]=runtime_total
          Path(".generated/hq-batman-asset-report.json").write_text(json.dumps(report,indent=2))
          assert runtime_total < 500*1024*1024, report
          print(json.dumps(report,indent=2))
          print("Round 5 asset contract PASS: same 279 timelines, proportional anchors, explicit true-3x pack.")

      - name: Validate Round 6 true-3x HUD/text contract
        shell: python
        run: |
          import json,struct
          from pathlib import Path
          from PIL import Image

          legacy=json.loads(Path("assets/hud.json").read_text())
          hq=json.loads(Path("assets/hud_hq.json").read_text())

          assert legacy["variables"] == hq["variables"] == {
              "702":"_root.batarangs","713":"_root.score","714":"_root.lives"
          }
          assert legacy["static_text"] == hq["static_text"] == {
              "700":"BATARANG","710":"HEALTH","711":"SCORE","715":"lives x"
          }
          assert legacy["output_scale"] == 1.0
          assert legacy["supersample"] == 1
          assert legacy["downsample"] == "none"
          assert hq["output_scale"] == 3.0
          assert hq["supersample"] == 2
          assert hq["temporary_scale"] == 6.0
          assert hq["downsample"] == "lanczos"

          data=Path("assets/hud_shell_hq.bin").read_bytes()
          assert data[:8] == b"BCBFRM02"
          assert struct.unpack_from("<I",data,8)[0] == 1
          assert abs(struct.unpack_from("<f",data,12)[0]-3.0) < 1e-6

          # Compare stage-space centers, not raw bitmap coordinates: the
          # supersampled baker is free to use different transparent padding.
          ROOT_X,ROOT_Y=159.0,-11.0
          la=legacy["anchor_in_bitmap"]
          ha=hq["anchor_in_bitmap"]
          for cid in ("702","713","714"):
              lb=legacy["fields"][cid]; hb=hq["fields"][cid]
              lcx=ROOT_X-la[0]+(lb[0]+lb[2])/2.0
              lcy=ROOT_Y-la[1]+(lb[1]+lb[3])/2.0
              hcx=ROOT_X*3.0-ha[0]+(hb[0]+hb[2])/2.0
              hcy=ROOT_Y*3.0-ha[1]+(hb[1]+hb[3])/2.0
              dx=abs(hcx-lcx*3.0); dy=abs(hcy-lcy*3.0)
              print("field",cid,"legacy center",(lcx,lcy),"HQ center",(hcx,hcy),"drift",(dx,dy))
              assert dx <= 1.0 and dy <= 1.0, (cid,dx,dy)

          with Image.open("assets/hud_base.png") as lo, Image.open("assets/hud_base_hq.png") as hi:
              la=lo.convert("RGBA").getchannel("A")
              ha=hi.convert("RGBA").getchannel("A")
              lb=la.getbbox(); hb=ha.getbbox()
              assert lb is not None and hb is not None
              lw,lh=lb[2]-lb[0],lb[3]-lb[1]
              hw,hh=hb[2]-hb[0],hb[3]-hb[1]
              # Compare visible artwork instead of raw canvas dimensions:
              # the native-bounds baker uses fixed pixel padding, so a 1x
              # canvas and a 6x->3x canvas do not have exactly 3x outer size.
              print("HUD visible bounds legacy",lb,(lw,lh),"HQ",hb,(hw,hh))
              assert abs(hw-lw*3) <= 12, (lw,hw)
              assert abs(hh-lh*3) <= 12, (lh,hh)
              lpartial=sum(la.histogram()[1:255])
              hpartial=sum(ha.histogram()[1:255])
              assert lpartial > 10000
              assert hpartial > lpartial*5, (lpartial,hpartial)

          with Image.open("assets/hud_digits_small.png") as lo, Image.open("assets/hud_digits_small_hq.png") as hi:
              assert hi.width > lo.width*2.5 and hi.height > lo.height*2.5
          with Image.open("assets/hud_digits_large.png") as lo, Image.open("assets/hud_digits_large_hq.png") as hi:
              assert hi.width > lo.width*2.5 and hi.height > lo.height*2.5

          baker=Path("reverse-engineering/tools/bake_hud_assets.py").read_text()
          assets=Path("src/assets.rs").read_text()
          render=Path("src/render.rs").read_text()
          for needle in (
              '"--output-scale"','"--supersample"','"--downsample"',
              'convert("RGBa").resize',
          ):
              assert needle in baker, needle
          for needle in (
              "hud_shell_hq: SpriteSet",
              "hud_digits_small_hq: Image",
              "hud_digits_large_hq: Image",
              'decode_sprite_frames_expected(include_bytes!("../assets/hud_shell_hq.bin"),3.0',
          ):
              assert needle in assets, needle
          for needle in (
              "draw_number_centered_hq_1to1",
              "blit_region_1to1",
              "Round 6 HUD assets already live at final presentation resolution",
          ):
              assert needle in render, needle

          hud_fn=render.split("fn draw_hud_hq",1)[1].split("fn draw_number_centered_hq_1to1",1)[0]
          digits_fn=render.split("fn draw_number_centered_hq_1to1",1)[1].split("fn draw_root_timeline_hq",1)[0]
          assert "blit_region_hq3" not in hud_fn
          assert "blit_region_hq3" not in digits_fn

          report={
              "legacy_hud_png_bytes":Path("assets/hud_base.png").stat().st_size,
              "hq_hud_png_bytes":Path("assets/hud_base_hq.png").stat().st_size,
              "hq_shell_pack_bytes":Path("assets/hud_shell_hq.bin").stat().st_size,
              "legacy_small_digits_png_bytes":Path("assets/hud_digits_small.png").stat().st_size,
              "hq_small_digits_png_bytes":Path("assets/hud_digits_small_hq.png").stat().st_size,
              "legacy_large_digits_png_bytes":Path("assets/hud_digits_large.png").stat().st_size,
              "hq_large_digits_png_bytes":Path("assets/hud_digits_large_hq.png").stat().st_size,
              "output_scale":3,
              "supersample":2,
              "downsample":"lanczos",
          }
          Path(".generated/hq-hud-asset-report.json").write_text(json.dumps(report,indent=2))
          print(json.dumps(report,indent=2))
          print("Round 6 HUD contract PASS: true 3x shell/text/digits, 1:1 runtime path, field centers locked.")

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Run sprite-pack compatibility tests
        run: cargo test --release --target x86_64-pc-windows-msvc

      - name: Build Level 1A fidelity slice
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Smoke-check executable, legacy pixels, HQ output and render timing
        shell: pwsh
        run: |
          $exe = "target/x86_64-pc-windows-msvc/release/batman_cobblebot_native.exe"
          if (!(Test-Path $exe)) { throw "EXE missing" }
          Get-Item $exe | Format-List Name,Length,LastWriteTime
          Get-FileHash $exe -Algorithm SHA256

          $legacy = Start-Process -FilePath $exe -ArgumentList @("--render-smoke", ".generated/visual-smoke") -Wait -PassThru
          if ($legacy.ExitCode -ne 0) { throw "Legacy visual smoke failed with exit code $($legacy.ExitCode)" }

          $hq = Start-Process -FilePath $exe -ArgumentList @("--render-smoke-hq", ".generated/visual-smoke-hq") -Wait -PassThru
          if ($hq.ExitCode -ne 0) { throw "HQ visual smoke failed with exit code $($hq.ExitCode)" }

          $bench = Start-Process -FilePath $exe -ArgumentList @("--benchmark-render", "60", ".generated/render-benchmark.json") -Wait -PassThru
          if ($bench.ExitCode -ne 0) { throw "Render benchmark failed with exit code $($bench.ExitCode)" }

          $legacyShots = Get-ChildItem ".generated/visual-smoke/*.png"
          $hqShots = Get-ChildItem ".generated/visual-smoke-hq/*.png"
          if ($legacyShots.Count -ne 16) { throw "Expected 16 legacy smoke screenshots, got $($legacyShots.Count)" }
          if ($hqShots.Count -ne 16) { throw "Expected 16 HQ smoke screenshots, got $($hqShots.Count)" }
          $legacyShots | Format-Table Name,Length
          $hqShots | Format-Table Name,Length
          Get-Content ".generated/render-benchmark.json"

      - name: Verify Round 2 legacy pixels against renderer-repair baseline
        shell: python
        run: |
          import hashlib
          from pathlib import Path

          expected={
              "00_fade_start.png":"fe797743d114f6f3dba95067b563387e6140ba3fcd5ec4eed5800255aaec9989",
              "01_fade_mid.png":"ade9c3ea39207d5cc87b015984244aba475a22e244f097ae1d4321f4874cef58",
