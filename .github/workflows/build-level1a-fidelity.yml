                  "downsample":"lanczos",
                  "alpha_filtering":"premultiplied",
              }, final
              strategy="stage-clipped-6x-premultiplied-lanczos-to-3x"

              data=Path("assets")/pack_name
              raw=data.read_bytes()
              assert raw[:8] == b"BCBFRM02", pack_name
              assert struct.unpack_from("<I",raw,8)[0] == count
              assert abs(struct.unpack_from("<f",raw,12)[0]-3.0) < 1e-6

              legacy_frame_bytes=legacy["size"][0]*legacy["size"][1]*4
              hq_frame_bytes=hq["size"][0]*hq["size"][1]*4
              legacy_cache_bytes=legacy_frame_bytes*min(2,count)
              hq_cache_bytes=hq_frame_bytes*min(2,count)
              legacy_cache_upper+=legacy_cache_bytes
              hq_cache_upper+=hq_cache_bytes
              report["timelines"][hq_name]={
                  "symbol":symbol,
                  "frames":count,
                  "legacy_canvas":legacy["size"],
                  "hq_canvas":hq["size"],
                  "legacy_pack_bytes":Path("assets",pack_name.replace("_hq.bin",".bin")).stat().st_size,
