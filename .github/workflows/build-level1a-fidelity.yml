name: build-level1a-fidelity

on:
  push:
    branches: [main, level1a-cxform-fidelity, hq-rendering-phase1-halftone, hq-rendering-phase2-surfaces, hq-rendering-phase3-3x-surface, hq-rendering-phase4-pack-v2, hq-rendering-phase5-batman-3x, hq-rendering-phase6-hud-3x, hq-rendering-phase7-overlays-3x, hq-rendering-phase8-world-objects-3x, hq-rendering-phase9-dpi-awareness, hq-rendering-phase10-scenery-eval]
  workflow_dispatch:

concurrency:
  group: batman-level1a-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Python asset dependency
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Fetch and verify canonical CobbleBot SWF
        shell: pwsh
        run: |
          $url = "https://archive.org/download/the-batman-cobblebot-caper/The%20Batman%20-%20The%20Cobblebot%20Caper.swf"
          Invoke-WebRequest -Uri $url -OutFile cobblebot-source.swf
          @'
          import hashlib, zlib
          from pathlib import Path
          src=Path("cobblebot-source.swf").read_bytes()
          if src[:3] == b"CWS":
              fws=b"FWS"+src[3:8]+zlib.decompress(src[8:])
          elif src[:3] == b"FWS":
              fws=src
          else:
              raise SystemExit(f"bad SWF signature {src[:3]!r}")
          expected="3d9e1992404313bc2e2652d46a5838160ef721e2ad559fdd7455f3c54f8ac1ed"
          got=hashlib.sha256(fws).hexdigest()
          print("canonical FWS SHA-256:",got)
          if got != expected:
              raise SystemExit(f"source mismatch: {got}")
          out=Path(".generated")
          out.mkdir(parents=True,exist_ok=True)
          (out/"cobblebot.swf").write_bytes(fws)
          '@ | python -

      - name: Rebuild original Level 1A assets from SWF
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $tools = "reverse-engineering/tools"
          $work = ".generated"
          $swf = "$work/cobblebot.swf"
          New-Item -ItemType Directory -Force -Path "$work/reports","$work/bitmaps","$work/sounds","$work/batman-frames","$work/batman-frames-hq","$work/pickup-frames","$work/pickup-frames-hq-super","$work/pickup-frames-hq","$work/batarang-frames","$work/batarang-frames-hq-super","$work/batarang-frames-hq","$work/level-title","$work/level-title-hq-super","$work/level-title-hq","$work/fadein","$work/fadein-hq-super","$work/fadein-hq","$work/fadeout","$work/fadeout-hq-super","$work/fadeout-hq","$work/tutorial-overlay","$work/tutorial-overlay-hq-super","$work/tutorial-overlay-hq","$work/hud","$work/hud-hq-super","$work/hud-hq-final","$work/level1a-tiles","$work/level1a-tiles-hq-base","$work/level1a-detail-tiles-1x","$work/level1a-detail-tiles-hq","$work/scenery-probes","assets","reverse-engineering/generated/collision_masks" | Out-Null

          python "$tools/swf_re.py" "$swf" "$work/reports"
          @'
          import json
          from pathlib import Path

          symbols=json.loads(Path(".generated/reports/symbols.json").read_text())
          root_placements=json.loads(Path(".generated/reports/root_placements.json").read_text())
          def frame0(sid):
              s=symbols.get(str(sid))
              if s is None:
                  return {"symbol":sid,"kind":"static_definition"}
              return {
                  "symbol":sid,
                  "frames":s.get("frames"),
                  "labels":s.get("labels",[]),
                  "placements":[p for p in s.get("placements",[]) if p.get("frame",0)==0],
              }
          # Include the game clip, background clip, and first visible-level clip.
          report={
              "root_frame_19":[p for p in root_placements if p.get("frame",0)<=19],
              "symbols":{str(sid):frame0(sid) for sid in (131,134,696,142,152)},
          }
          Path(".generated/background-tree.json").write_text(json.dumps(report,indent=2))
          actions=json.loads(Path(".generated/reports/actions.json").read_text())
          title_actions=[
              block for block in actions
              if "746" in str(block.get("context",""))
              or any("levelTitle" in str(x) or "visible" in str(x) or "_alpha" in str(x)
                     for x in block.get("strings",[]))
          ]
          Path(".generated/title-actions.json").write_text(json.dumps(title_actions,indent=2))
          print("Level-title related action blocks:")
          print(json.dumps(title_actions,indent=2))
          print("Level 1A background tree:")
          print(json.dumps(report,indent=2))
          '@ | python -
          python "$tools/extract_bitmaps.py" "$swf" "$work/bitmaps"

          # Round 10 evaluation: isolate the repeated visible Level-1A child
          # symbols before deciding which scenery layer should move to true 3x.
          # These probes are diagnostic only and do not change runtime assets.
          foreach ($sid in 144,145,146,147) {
            python "$tools/bake_sprite_frames.py" "$swf" "$work/reports/symbols.json" "$work/scenery-probes/symbol-$sid-1x.png" --bitmaps "$work/bitmaps" --symbol $sid --frame 0 --scale 1.0 --native-bounds
            python "$tools/bake_sprite_frames.py" "$swf" "$work/reports/symbols.json" "$work/scenery-probes/symbol-$sid-6x.png" --bitmaps "$work/bitmaps" --symbol $sid --frame 0 --scale 6.0 --native-bounds
          }

          python "$tools/extract_sounds.py" "$swf" "$work/sounds"
          Copy-Item "$work/sounds/0751_sound_0751.mp3" "assets/level1a_music.mp3"
          Copy-Item "$work/sounds/0248_sound_0248.mp3" "assets/jump.mp3"
          Copy-Item "$work/sounds/0004_item.mp3" "assets/item.mp3"
          python "$tools/stage_ui_screens.py" "$work/bitmaps" "assets"

          python "$tools/render_collision_masks.py" "$swf" "$work/reports/symbols.json" "reverse-engineering/manifests/level-instances.json" "reverse-engineering/generated/collision_masks" --level level1a

          # Preserve the exact 1x player pack as the legacy regression oracle.
          python "$tools/bake_player_states.py" "$swf" "$work/reports/symbols.json" "$work/batman-frames" --bitmaps "$work/bitmaps" --symbol 691 --scale 0.163742
          python "$tools/pack_sprite_frames.py" "$work/batman-frames" "assets/batman_frames.bin" --format-version 2 --logical-pixel-scale 1.0

          # Round 5: rerasterize the same 279 true child frames at final 3x,
          # first at 6x (3x output * 2x supersample), then premultiplied-alpha
          # Lanczos downsample to the final 3x pack.
          python "$tools/bake_player_states.py" "$swf" "$work/reports/symbols.json" "$work/batman-frames-hq" --bitmaps "$work/bitmaps" --symbol 691 --scale 0.163742 --output-scale 3 --supersample 2 --downsample lanczos
          python "$tools/pack_sprite_frames.py" "$work/batman-frames-hq" "assets/batman_frames_hq.bin" --format-version 2 --logical-pixel-scale 3.0

          python "$tools/extract_player_sound_events.py" "$swf" "$work/reports/symbols.json" "$work/batman-frames/manifest.json" "reverse-engineering/manifests/sound-manifest.json" "$work/player_sound_events.json"

          python "$tools/bake_sprite_frames.py" "$swf" "$work/reports/symbols.json" "$work/pickup-frames" --bitmaps "$work/bitmaps" --symbol 695 --scale 1.130691 --all-frames
          python "$tools/pack_sprite_frames.py" "$work/pickup-frames" "assets/pickup_frames.bin"

          # Round 8: rebuild the small moving world objects at a temporary 6x
          # relative to their recovered logical display scale, then filter to
          # final 3x and pack with explicit logical_pixel_scale = 3.0.
          python "$tools/bake_sprite_frames.py" "$swf" "$work/reports/symbols.json" "$work/pickup-frames-hq-super" --bitmaps "$work/bitmaps" --symbol 695 --scale 6.784146 --all-frames
          python "$tools/finalize_hq_timeline.py" "$work/pickup-frames-hq-super" "$work/pickup-frames-hq" --output-scale 3.392073 --supersample 2
          python "$tools/pack_sprite_frames.py" "$work/pickup-frames-hq" "assets/pickup_frames_hq.bin" --format-version 2 --logical-pixel-scale 3.0

          python "$tools/bake_sprite_frames.py" "$swf" "$work/reports/symbols.json" "$work/batarang-frames" --bitmaps "$work/bitmaps" --symbol 694 --scale 0.364471 --all-frames
          python "$tools/pack_sprite_frames.py" "$work/batarang-frames" "assets/batarang_frames.bin" --format-version 1
          python "$tools/bake_sprite_frames.py" "$swf" "$work/reports/symbols.json" "$work/batarang-frames-hq-super" --bitmaps "$work/bitmaps" --symbol 694 --scale 2.186826 --all-frames
          python "$tools/finalize_hq_timeline.py" "$work/batarang-frames-hq-super" "$work/batarang-frames-hq" --output-scale 1.093413 --supersample 2
          python "$tools/pack_sprite_frames.py" "$work/batarang-frames-hq" "assets/batarang_frames_hq.bin" --format-version 2 --logical-pixel-scale 3.0

          python "$tools/pack_sprite_frames.py" "$work/batarang-frames" "assets/scale_probe.bin" --format-version 2 --logical-pixel-scale 3.0

          # Root gameplay frame 19 has two backdrop layers below game:
          # depth 1 = character 131, depth 2 = character 134 at (300,130)
          # scaled 0.769348. Preserve both; omitting them leaves a black sky.
          python "$tools/bake_sprite_frames.py" "$swf" "$work/reports/symbols.json" "assets/root_bg_131.png" --bitmaps "$work/bitmaps" --symbol 131 --frame 0 --scale 1.0 --native-bounds
          python "$tools/bake_sprite_frames.py" "$swf" "$work/reports/symbols.json" "assets/root_bg_134.png" --bitmaps "$work/bitmaps" --symbol 134 --frame 0 --scale 1.0 --native-bounds

          python "$tools/bake_sprite_frames.py" "$swf" "$work/reports/symbols.json" "assets/level1a_bg.png" --bitmaps "$work/bitmaps" --symbol 142 --frame 0 --scale 1.0 --native-bounds

          python "$tools/bake_sprite_frames.py" "$swf" "$work/reports/symbols.json" "$work/level-title" --bitmaps "$work/bitmaps" --symbol 746 --scale 1.0 --all-frames
          python "$tools/pack_sprite_frames.py" "$work/level-title" "assets/level_title_frames.bin"
          python "$tools/bake_sprite_frames.py" "$swf" "$work/reports/symbols.json" "$work/fadein" --bitmaps "$work/bitmaps" --symbol 747 --scale 1.0 --all-frames
          python "$tools/pack_sprite_frames.py" "$work/fadein" "assets/fadein_frames.bin"
          python "$tools/bake_sprite_frames.py" "$swf" "$work/reports/symbols.json" "$work/fadeout" --bitmaps "$work/bitmaps" --symbol 34 --scale 1.0 --all-frames
          python "$tools/pack_sprite_frames.py" "$work/fadeout" "assets/fadeout_frames.bin"
          python "$tools/bake_sprite_frames.py" "$swf" "$work/reports/symbols.json" "$work/tutorial-overlay" --bitmaps "$work/bitmaps" --symbol 737 --scale 1.0 --all-frames
          python "$tools/pack_sprite_frames.py" "$work/tutorial-overlay" "assets/tutorial_overlay_frames.bin"

          # Round 7: resolve each foreground timeline at 6x so embedded
          # DefineText, masks and CXFORMWITHALPHA are already applied before
          # premultiplied-alpha Lanczos downsampling to the final true 3x pack.
          # The baker clips against the real 600x400 stage at each root
          # placement, so huge off-screen fade geometry never allocates a
          # giant native-bounds canvas.
          python "$tools/bake_sprite_frames.py" "$swf" "$work/reports/symbols.json" "$work/level-title-hq-super" --bitmaps "$work/bitmaps" --symbol 746 --scale 6.0 --all-frames --clip-stage-width 600 --clip-stage-height 400 --place-x 318.7 --place-y 76.75
          python "$tools/finalize_hq_timeline.py" "$work/level-title-hq-super" "$work/level-title-hq" --output-scale 3 --supersample 2
          python "$tools/pack_sprite_frames.py" "$work/level-title-hq" "assets/level_title_frames_hq.bin" --format-version 2 --logical-pixel-scale 3.0

          python "$tools/bake_sprite_frames.py" "$swf" "$work/reports/symbols.json" "$work/fadein-hq-super" --bitmaps "$work/bitmaps" --symbol 747 --scale 6.0 --all-frames --clip-stage-width 600 --clip-stage-height 400 --place-x 301 --place-y 205
          python "$tools/finalize_hq_timeline.py" "$work/fadein-hq-super" "$work/fadein-hq" --output-scale 3 --supersample 2
          python "$tools/pack_sprite_frames.py" "$work/fadein-hq" "assets/fadein_frames_hq.bin" --format-version 2 --logical-pixel-scale 3.0

          python "$tools/bake_sprite_frames.py" "$swf" "$work/reports/symbols.json" "$work/fadeout-hq-super" --bitmaps "$work/bitmaps" --symbol 34 --scale 6.0 --all-frames --clip-stage-width 600 --clip-stage-height 400 --place-x 301 --place-y 205
          python "$tools/finalize_hq_timeline.py" "$work/fadeout-hq-super" "$work/fadeout-hq" --output-scale 3 --supersample 2
          python "$tools/pack_sprite_frames.py" "$work/fadeout-hq" "assets/fadeout_frames_hq.bin" --format-version 2 --logical-pixel-scale 3.0

          python "$tools/bake_sprite_frames.py" "$swf" "$work/reports/symbols.json" "$work/tutorial-overlay-hq-super" --bitmaps "$work/bitmaps" --symbol 737 --scale 6.0 --all-frames --clip-stage-width 600 --clip-stage-height 400 --place-x 311.4 --place-y 190
          python "$tools/finalize_hq_timeline.py" "$work/tutorial-overlay-hq-super" "$work/tutorial-overlay-hq" --output-scale 3 --supersample 2
          python "$tools/pack_sprite_frames.py" "$work/tutorial-overlay-hq" "assets/tutorial_overlay_frames_hq.bin" --format-version 2 --logical-pixel-scale 3.0

          # Original HUD shell (symbol 716). Flash _sans resolves to Arial on
          # Windows; bake only the static labels and numeric atlases. Rust owns
          # the changing Batarang/Score/Lives values at runtime.
          python "$tools/bake_sprite_frames.py" "$swf" "$work/reports/symbols.json" "$work/hud" --bitmaps "$work/bitmaps" --symbol 716 --scale 1.0 --all-frames
          python "$tools/bake_hud_assets.py" "$swf" "$work/reports/symbols.json" "$work/hud" "assets" --font "C:/Windows/Fonts/arial.ttf"

          # Round 6: rasterize HUD vector/device-font content at 6x, then
          # premultiplied-alpha Lanczos downsample to the final true 3x assets.
          python "$tools/bake_sprite_frames.py" "$swf" "$work/reports/symbols.json" "$work/hud-hq-super" --bitmaps "$work/bitmaps" --symbol 716 --scale 6.0 --all-frames
          python "$tools/bake_hud_assets.py" "$swf" "$work/reports/symbols.json" "$work/hud-hq-super" "assets" --font "C:/Windows/Fonts/arial.ttf" --output-scale 3 --supersample 2 --downsample lanczos --suffix "_hq" --pack-dir "$work/hud-hq-final"
          python "$tools/pack_sprite_frames.py" "$work/hud-hq-final" "assets/hud_shell_hq.bin" --format-version 2 --logical-pixel-scale 3.0
          # Legacy full level remains the exact regression oracle.
          python "$tools/bake_level_tiles.py" "$swf" "$work/reports/symbols.json" "$work/level1a-tiles" --bitmaps "$work/bitmaps" --symbol 152 --place-x 2467.65 --place-y 239.25 --exclude-symbol 149 --exclude-symbol 151 --exclude-symbol 153
          python "$tools/pack_level_tiles.py" "$work/level1a-tiles" "assets/level1a_tiles.bin"

          # Round 10 selective scenery split.
          #
          # HQ base: retain the cheap flat/low-detail geometry (including 147)
          # but remove window/facade detail symbols 144-146 before 1x promotion.
          python "$tools/bake_level_tiles.py" "$swf" "$work/reports/symbols.json" "$work/level1a-tiles-hq-base" --bitmaps "$work/bitmaps" --symbol 152 --place-x 2467.65 --place-y 239.25 --exclude-symbol 149 --exclude-symbol 151 --exclude-symbol 153 --exclude-symbol 144 --exclude-symbol 145 --exclude-symbol 146
          python "$tools/pack_level_tiles.py" "$work/level1a-tiles-hq-base" "assets/level1a_tiles_hq_base.bin"

          # 1x detail oracle: keep only 144-146. This is used to prove that
          # base + detail can reproduce the original full level exactly before
          # the same logical detail is replaced by true 3x pixels.
          python "$tools/bake_level_tiles.py" "$swf" "$work/reports/symbols.json" "$work/level1a-detail-tiles-1x" --bitmaps "$work/bitmaps" --symbol 152 --place-x 2467.65 --place-y 239.25 --exclude-symbol 149 --exclude-symbol 151 --exclude-symbol 153 --exclude-symbol 14 --exclude-symbol 147

          # True-HQ detail: rasterize the same selected display-list content at
          # 6x with tile overscan, premultiplied-alpha Lanczos to final 3x,
          # then crop transparent margins in BCLVT002 for runtime efficiency.
          python "$tools/bake_level_tiles.py" "$swf" "$work/reports/symbols.json" "$work/level1a-detail-tiles-hq" --bitmaps "$work/bitmaps" --symbol 152 --place-x 2467.65 --place-y 239.25 --exclude-symbol 149 --exclude-symbol 151 --exclude-symbol 153 --exclude-symbol 14 --exclude-symbol 147 --output-scale 3 --supersample 2 --downsample lanczos
          python "$tools/pack_level_tiles.py" "$work/level1a-detail-tiles-hq" "assets/level1a_detail_tiles_hq.bin" --format-version 2 --logical-pixel-scale 3.0 --crop-transparent

      - name: Validate recovered assets and reject leaked control geometry
        shell: python
        run: |
          import json
          from pathlib import Path
          from PIL import Image

          sounds=json.loads(Path(".generated/sounds/manifest.json").read_text())
          byid={x["id"]:x for x in sounds}
          expected_sounds={
              4:("item","mp3",1961),
              248:("sound_0248","mp3",5482),
              751:("sound_0751","mp3",83335),
          }
          for sid,(name,fmt,samples) in expected_sounds.items():
              rec=byid[sid]
              assert rec["export_name"]==name,rec
              assert rec["format_name"]==fmt,rec
              assert rec["sample_count"]==samples,rec
          print("Level 1A sound assets:",{sid:byid[sid]["file"] for sid in expected_sounds})

          player_audio=json.loads(Path(".generated/player_sound_events.json").read_text())
          nonempty=[x for x in player_audio if x["events"]]
          assert nonempty == [{
              "name":"jump","child_symbol":262,
              "events":[{"frame":1,"sound_id":248,"name":"sound_0248"}]
          }],nonempty

          # Root frame 19 starts the Level 1A loop: sound 751, loopCount 32767.
          import struct,sys
          sys.path.insert(0,"reverse-engineering/tools")
          from swf_re import read_rect,tags
          swf=Path(".generated/cobblebot.swf").read_bytes()
          _,p=read_rect(swf,8);p+=4
          frame=0;root_event=None
          for code,payload,_,_ in tags(swf,p,len(swf)):
              if code==1: frame+=1
              elif code==15 and frame==19:
                  sid=struct.unpack_from("<H",payload,0)[0]
                  flags=payload[2]
                  q=3
                  if flags&1:q+=4
                  if flags&2:q+=4
                  loops=struct.unpack_from("<H",payload,q)[0] if flags&4 else 1
                  root_event=(sid,loops)
                  break
          assert root_event==(751,32767),root_event

          player=json.loads(Path(".generated/batman-frames/manifest.json").read_text())
          symbols=json.loads(Path(".generated/reports/symbols.json").read_text())
          relevant=(142,716,737,746,169,242)
          cxform_counts={sid:sum("cxform" in p for p in symbols[str(sid)]["placements"])
                         for sid in relevant}
          print("Recovered CXFORMWITHALPHA placements:",cxform_counts)
          assert cxform_counts == {142:56,716:1,737:7,746:21,169:1,242:19}, cxform_counts
          for sid in relevant:
              for placement in symbols[str(sid)]["placements"]:
                  if placement.get("flags",0)&0x08:
                      assert set(placement["cxform"]) == {"mult","add"}, placement
                      assert len(placement["cxform"]["mult"]) == 4, placement
                      assert len(placement["cxform"]["add"]) == 4, placement
          expected=[
              ("stand",9),("walk",12),("run",10),("jump",4),("fall",5),("glide",2),
              ("land",2),("duck",5),("up",2),("punch",11),("highpunch",11),
              ("lowpunch",9),("jumppunch",9),("kick",8),("highkick",8),
              ("lowkick",15),("jumpkick",10),("batarang",9),("duckbatarang",12),
              ("jumpbatarang",7),("grapplingup",10),("grappling",28),
              ("capespin",9),("hurt2",17),("hurt",11),("electro",21),("die",23),
          ]
          actual=[(x["name"],x["frame_count"]) for x in player["states"]]
          print("Batman child timelines:",actual,"total",player["frame_count"])
          assert player["frame_count"] == 279
          assert actual == expected
          assert player["unsupported_fills"] == []
          assert player["missing_bitmap_ids"] == []

          tutorial=json.loads(Path(".generated/tutorial-overlay/manifest.json").read_text())
          assert tutorial["frame_count"] == 149
          assert tutorial["unsupported_fills"] == []
          # The generic sprite baker now renders every embedded DefineText
          # record using the SWF's own embedded font glyphs.
          assert tutorial["missing_bitmap_ids"] == [], tutorial["missing_bitmap_ids"]

          hud=json.loads(Path("assets/hud.json").read_text())
          print("HUD:",hud)
          assert hud["hud_size"] == [283,86], hud["hud_size"]
          assert hud["variables"] == {"702":"_root.batarangs","713":"_root.score","714":"_root.lives"}, hud["variables"]
          assert hud["static_text"] == {"700":"BATARANG","710":"HEALTH","711":"SCORE","715":"lives x"}, hud["static_text"]

          # Image-level gates for the placement color transforms. The HUD's
          # panel is intentionally translucent (alpha multiplier 82/256), and
          # the level-title clip fades through exact 204/153/102/51 steps.
          # These checks prevent a parser that merely records CXFORM values
          # without applying them from passing CI.
          with Image.open("assets/hud_base.png") as im:
              alpha=im.convert("RGBA").getchannel("A")
              hist=alpha.histogram()
              partial=sum(hist[1:255])
              print("HUD partial-alpha pixels:",partial)
              assert partial > 10000, partial
          for frame,expected in [(44,204),(45,153),(46,102),(47,51),(50,51)]:
              with Image.open(Path(".generated/level-title")/f"{frame:03}.png") as im:
                  maximum=im.convert("RGBA").getchannel("A").getextrema()[1]
                  assert maximum == expected, (frame,maximum,expected)

          for name,count in [("level-title",100),("fadein",43),("fadeout",41)]:
              ui=json.loads(Path(f".generated/{name}/manifest.json").read_text())
              assert ui["frame_count"] == count
              assert ui["unsupported_fills"] == []
              assert ui["missing_bitmap_ids"] == []

          root=Path(".generated/level1a-tiles")
          manifest=json.loads((root/"manifest.json").read_text())
          assert manifest["excluded_symbols"] == [149,151,153]
          assert manifest["unsupported_fills"] == []

          total=red=blue=0
          for item in manifest["tiles"]:
              with Image.open(root/item["file"]) as im:
                  for r,g,b,a in im.convert("RGBA").getdata():
                      if a < 16:
                          continue
                      total += 1
                      red += int(r > 160 and g < 80 and b < 80)
                      blue += int(b > 120 and r < 90 and g < 120)
          red_ratio=red/max(1,total)
          blue_ratio=blue/max(1,total)
          print("visible pixels",total,"red ratio",red_ratio,"blue ratio",blue_ratio)
          if red_ratio > 0.005 or blue_ratio > 0.001:
              raise SystemExit("control geometry leaked into visible Level 1A tiles")

      - name: Validate Round 1 presentation contract
        shell: python
        run: |
          from pathlib import Path
          src=Path("src/win32.rs").read_text()
          required=[
              "const HALFTONE:i32=4",
              "SetStretchBltMode(hdc,HALFTONE)",
              "SetBrushOrgEx(hdc,0,0,null_mut())",
              "RenderSurface::new(LOGICAL_W,LOGICAL_H)",
              "biWidth:app.fb.w as i32",
              "biHeight:-(app.fb.h as i32)",
          ]
          missing=[x for x in required if x not in src]
          if missing:
              raise SystemExit(f"Round 1 presenter contract missing: {missing}")
          # Phase 1 behavior survives the Phase 2 abstraction: the active
          # legacy surface is still exactly the original logical 600x400.
          print("Round 1 contract OK: HALFTONE retained; legacy surface remains LOGICAL_W x LOGICAL_H.")

      - name: Validate Round 2 surface abstraction contract
