          }
          root=Path(".generated/visual-smoke")
          actual={p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in root.glob("*.png")}
          missing=set(expected)-set(actual)
          extra=set(actual)-set(expected)
          allowed_extra={"04_walk.png","13_world_objects.png"}
          if missing or extra!=allowed_extra:
              raise SystemExit(f"legacy screenshot set changed unexpectedly: missing={sorted(missing)} extra={sorted(extra)}")
          bad={name:(expected[name],actual[name]) for name in expected if actual[name]!=expected[name]}
          if bad:
              raise SystemExit(f"Round 2 changed legacy pixels: {bad}")
          print(f"Legacy pixel identity PASS: {len(expected)}/{len(expected)} historical screenshots still match Run 45 exactly; Round-5 walk and Round-8 world-object checkpoints are additive.")

      - name: Verify Round 5 HQ output and render timing
        shell: python
        run: |
          import json
          from pathlib import Path
          from PIL import Image

          legacy=sorted(Path(".generated/visual-smoke").glob("*.png"))
          hq=sorted(Path(".generated/visual-smoke-hq").glob("*.png"))
          assert [p.name for p in legacy] == [p.name for p in hq]
          assert len(legacy) == 17
          for lp,hp in zip(legacy,hq):
              with Image.open(lp) as lo, Image.open(hp) as hi:
                  assert lo.size == (600,400), (lp.name,lo.size)
                  assert hi.size == (1800,1200), (hp.name,hi.size)
                  assert hi.width*2 == hi.height*3

          bench=json.loads(Path(".generated/render-benchmark.json").read_text())
          assert bench["mode"] == "hq3x", bench
          assert (bench["logical_width"],bench["logical_height"]) == (600,400), bench
          assert (bench["hq_width"],bench["hq_height"]) == (1800,1200), bench
          assert bench["framebuffer_bytes"] == 9600000, bench
          for key in ("mean_ms","p50_ms","p95_ms","max_ms"):
              assert bench[key] >= 0.0, (key,bench[key])

          print("HQ dimensions PASS: 17/17 frames are 1800x1200, including the Round-8 world-object checkpoint.")
          print("Round 5 render benchmark:",json.dumps(bench,indent=2))

      - name: Build Round 5 Batman A-B comparison sheets
        shell: python
        run: |
          import json
          from pathlib import Path
          from PIL import Image,ImageDraw

          legacy_root=Path(".generated/batman-frames")
          hq_root=Path(".generated/batman-frames-hq")
          out=Path(".generated/batman-hq-comparisons")
          out.mkdir(parents=True,exist_ok=True)
          legacy=json.loads((legacy_root/"manifest.json").read_text())
          hq=json.loads((hq_root/"manifest.json").read_text())
          states={x["name"]:x for x in legacy["states"]}
          wanted=["stand","walk","run","jump","glide","punch","kick"]

          for name in wanted:
              state=states[name]
              frame=state["start"]+state["frame_count"]//2
              with Image.open(legacy_root/f"{frame:03}.png") as a0, Image.open(hq_root/f"{frame:03}.png") as b0:
                  a=a0.convert("RGBA").resize((a0.width*3,a0.height*3),Image.Resampling.BILINEAR)
                  b=b0.convert("RGBA")
              panel_w=max(a.width,b.width)
              panel_h=max(a.height,b.height)
              top=28
              sheet=Image.new("RGBA",(panel_w*2+12,panel_h+top),(28,28,28,255))
              sheet.alpha_composite(a,((panel_w-a.width)//2,top+(panel_h-a.height)//2))
              sheet.alpha_composite(b,(panel_w+12+(panel_w-b.width)//2,top+(panel_h-b.height)//2))
              draw=ImageDraw.Draw(sheet)
              draw.text((6,6),f"{name}: legacy 1x -> bilinear 3x",fill=(255,255,255,255))
              draw.text((panel_w+18,6),f"{name}: true SWF reraster 3x",fill=(255,255,255,255))
              sheet.save(out/f"{name}.png")

          assert len(list(out.glob("*.png"))) == 7
          print("Built 7 Batman A/B comparison sheets:",wanted)

