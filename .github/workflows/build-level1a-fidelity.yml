      - name: Build Round 7 foreground A-B comparison sheets
        shell: python
        run: |
          from pathlib import Path
          from PIL import Image,ImageDraw

          out=Path(".generated/overlay-hq-comparisons")
          out.mkdir(parents=True,exist_ok=True)

          specs=[
              ("tutorial",".generated/tutorial-overlay",".generated/tutorial-overlay-hq","auto"),
              ("level-title",".generated/level-title",".generated/level-title-hq","auto"),
              ("fade-in",".generated/fadein",".generated/fadein-hq","middle"),
              ("fade-out",".generated/fadeout",".generated/fadeout-hq","middle"),
          ]

          def visible_score(path):
              with Image.open(path) as im:
                  return sum(im.convert("RGBA").getchannel("A").histogram()[1:])

          for name,legacy_dir,hq_dir,mode in specs:
              legacy=Path(legacy_dir); hq=Path(hq_dir)
              files=sorted(legacy.glob("*.png"))
              if mode=="middle":
                  chosen=files[len(files)//2]
              else:
                  chosen=max(files,key=visible_score)
              hp=hq/chosen.name
              with Image.open(chosen) as a0, Image.open(hp) as b0:
                  a0=a0.convert("RGBA"); b=b0.convert("RGBA")
                  a=a0.resize((a0.width*3,a0.height*3),Image.Resampling.BILINEAR)
              panel_w=max(a.width,b.width); panel_h=max(a.height,b.height); top=28
              sheet=Image.new("RGBA",(panel_w*2+12,panel_h+top),(28,28,28,255))
              sheet.alpha_composite(a,((panel_w-a.width)//2,top+(panel_h-a.height)//2))
              sheet.alpha_composite(b,(panel_w+12+(panel_w-b.width)//2,top+(panel_h-b.height)//2))
              draw=ImageDraw.Draw(sheet)
              draw.text((6,6),f"{name} frame {chosen.stem}: legacy 1x -> bilinear 3x",fill=(255,255,255,255))
              draw.text((panel_w+18,6),f"{name} frame {chosen.stem}: true SWF 6x -> Lanczos 3x",fill=(255,255,255,255))
              sheet.save(out/f"{name}.png")

          assert len(list(out.glob("*.png"))) == 4
          print("Built 4 Round-7 foreground A/B sheets.")

