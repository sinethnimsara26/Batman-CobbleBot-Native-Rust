          }
          root=Path(".generated/visual-smoke")
          actual={p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in root.glob("*.png")}
          missing=set(expected)-set(actual)
          extra=set(actual)-set(expected)
          if missing or extra!={"04_walk.png"}:
              raise SystemExit(f"legacy screenshot set changed unexpectedly: missing={sorted(missing)} extra={sorted(extra)}")
          bad={name:(expected[name],actual[name]) for name in expected if actual[name]!=expected[name]}
          if bad:
