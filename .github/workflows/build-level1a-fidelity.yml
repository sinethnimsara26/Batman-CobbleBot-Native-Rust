              hq=json.loads(Path(".generated",spec["hq_dir"],"manifest.json").read_text())
              assert legacy["symbol"] == hq["symbol"] == spec["symbol"]
              assert legacy["frame_count"] == hq["frame_count"] > 0
              assert legacy["source_bounds"] == hq["source_bounds"]
              assert legacy["unsupported_fills"] == hq["unsupported_fills"] == []
              assert legacy["missing_bitmap_ids"] == hq["missing_bitmap_ids"] == []
              assert [x.get("animation") for x in legacy["frames"]] == [x.get("animation") for x in hq["frames"]]
              assert math.isclose(legacy["scale"][0],spec["base_scale"],abs_tol=1e-6)
              assert math.isclose(legacy["scale"][1],spec["base_scale"],abs_tol=1e-6)
              assert math.isclose(hq["scale"][0],spec["base_scale"]*3.0,abs_tol=1e-6)
              assert math.isclose(hq["scale"][1],spec["base_scale"]*3.0,abs_tol=1e-6)
              final=hq["hq_finalize"]
              assert math.isclose(final["source_scale"],spec["base_scale"]*6.0,abs_tol=1e-6), final
              assert math.isclose(final["output_scale"],spec["base_scale"]*3.0,abs_tol=1e-6), final
              assert final["supersample"] == 2
              assert final["downsample"] == "lanczos"
              assert final["alpha_filtering"] == "premultiplied"

              raw=Path("assets",spec["hq_pack"]).read_bytes()
              assert raw[:8] == b"BCBFRM02"
              assert struct.unpack_from("<I",raw,8)[0] == hq["frame_count"]
              assert abs(struct.unpack_from("<f",raw,12)[0]-3.0) < 1e-6

              legacy_side=json.loads(Path("assets",spec["legacy_pack"].replace(".bin",".json")).read_text())
              hq_side=json.loads(Path("assets",spec["hq_pack"].replace(".bin",".json")).read_text())
              assert legacy_side["frame_count"] == hq_side["frame_count"] == hq["frame_count"]
              assert abs(hq_side["logical_pixel_scale"]-3.0) < 1e-6

              # Packed anchors include the alpha-crop origin, so they are not
              # expected to be numerically exact 3x copies. The generic baker
              # uses a fixed 2-pixel canvas pad at every raster scale: legacy
              # therefore carries 2px, while the 6x supersample is finalized
              # by /2 to 1 HQ pixel. Comparing against a naive 3x legacy canvas
              # creates an expected 6-1 = 5 HQ-pixel bookkeeping delta before
              # Lanczos crop-fringe effects. This is NOT stage-space drift;
              # runtime placement uses each pack's own recovered anchor.
              worst_cropped_anchor_delta=0.0
              for lo,hi in zip(legacy_side["frames"],hq_side["frames"]):
                  la=lo["anchor_in_cropped_image"]
                  ha=hi["anchor_in_cropped_image"]
                  delta=max(abs(ha[0]-la[0]*3.0),abs(ha[1]-la[1]*3.0))
                  worst_cropped_anchor_delta=max(worst_cropped_anchor_delta,delta)
                  assert delta <= 6.0, (spec["name"],lo["frame"],la,ha,delta)

              legacy_decoded=sum(x["size"][0]*x["size"][1]*4 for x in legacy_side["frames"])
              hq_decoded=sum(x["size"][0]*x["size"][1]*4 for x in hq_side["frames"])
              eager_bytes += legacy_decoded + hq_decoded
              report["objects"][spec["name"]]={
                  "symbol":spec["symbol"],
                  "frames":hq["frame_count"],
                  "legacy_scale":spec["base_scale"],
                  "hq_swf_scale":spec["base_scale"]*3.0,
                  "temporary_swf_scale":spec["base_scale"]*6.0,
                  "legacy_pack_bytes":Path("assets",spec["legacy_pack"]).stat().st_size,
                  "hq_pack_bytes":Path("assets",spec["hq_pack"]).stat().st_size,
                  "legacy_decoded_rgba_bytes":legacy_decoded,
                  "hq_decoded_rgba_bytes":hq_decoded,
                  "worst_cropped_anchor_delta_hq_pixels":worst_cropped_anchor_delta,
              }

          assets=Path("src/assets.rs").read_text()
          render=Path("src/render.rs").read_text()
          headless=Path("src/headless.rs").read_text()
          for needle in (
              "pickup_frames_hq: SpriteSet",
              "batarang_frames_hq: SpriteSet",
              'decode_sprite_frames_expected(include_bytes!("../assets/pickup_frames_hq.bin"),3.0',
              'decode_sprite_frames_expected(include_bytes!("../assets/batarang_frames_hq.bin"),3.0',
          ):
              assert needle in assets, needle
          for needle in (
              "upscale_opaque_base(base,target)",
              "draw_world_objects_hq(target,game,assets)",
              "fn draw_world_objects_hq",
              "scenery at 1x -> promote -> true 3x pickups/Batarangs",
          ):
              assert needle in render, needle
          hq_fn=render.split("fn draw_world_objects_hq",1)[1].split("fn draw_batman_legacy",1)[0]
          assert "blit_region_hq3" not in hq_fn
          assert "pickup_frames_hq" in hq_fn and "batarang_frames_hq" in hq_fn
          assert '"13_world_objects.png"' in headless

          previous=json.loads(Path(".generated/hq-overlay-asset-report.json").read_text())
          report["round8_legacy_plus_hq_eager_rgba_bytes"]=eager_bytes
          report["previous_known_sprite_rgba_upper_bound"]=previous["combined_known_sprite_rgba_upper_bound"]
          report["combined_known_sprite_rgba_upper_bound"]=(
              report["previous_known_sprite_rgba_upper_bound"]+eager_bytes
          )
          assert report["combined_known_sprite_rgba_upper_bound"] < 500*1024*1024, report
          Path(".generated/hq-world-object-asset-report.json").write_text(json.dumps(report,indent=2))
          print(json.dumps(report,indent=2))
          print("Round 8 contract PASS: pickup 695 and projectile 694 are true-3x, depth-correct, and 1:1 at runtime.")

      - name: Build Round 10 scenery evaluation report
        shell: python
        run: |
          import json,sys
          from pathlib import Path
          from PIL import Image,ImageDraw

          symbols=json.loads(Path(".generated/reports/symbols.json").read_text())
          level=symbols["152"]
          wanted={144,145,146,147}
          placements=[
              {
                  "depth":p["depth"],
                  "character_id":p["character_id"],
                  "matrix":p.get("matrix",{}),
              }
              for p in level["placements"]
              if p.get("frame",0)==0 and p.get("character_id") in wanted
          ]
          counts={str(sid):sum(p["character_id"]==sid for p in placements) for sid in sorted(wanted)}
          depth_ranges={}
          for sid in sorted(wanted):
              depths=[p["depth"] for p in placements if p["character_id"]==sid]
              depth_ranges[str(sid)]=[min(depths),max(depths)]

          probe_root=Path(".generated/scenery-probes")
          out=probe_root/"comparisons"
          out.mkdir(parents=True,exist_ok=True)
          probe_info={}
          for sid in sorted(wanted):
              lo_path=probe_root/f"symbol-{sid}-1x.png"
              hi6_path=probe_root/f"symbol-{sid}-6x.png"
              with Image.open(lo_path) as lo0, Image.open(hi6_path) as hi60:
                  lo=lo0.convert("RGBA")
                  hi6=hi60.convert("RGBA")
                  # Existing-world comparison: the current 1x asset promoted 3x.
                  legacy=lo.resize((lo.width*3,lo.height*3),Image.Resampling.BILINEAR)
                  # Candidate true-HQ comparison: premultiplied-alpha 6x -> 3x.
                  final_size=(max(1,round(hi6.width/2)),max(1,round(hi6.height/2)))
                  hq=hi6.convert("RGBa").resize(final_size,Image.Resampling.LANCZOS).convert("RGBA")
              panel_w=max(legacy.width,hq.width)
              panel_h=max(legacy.height,hq.height)
              top=30
              sheet=Image.new("RGBA",(panel_w*2+12,panel_h+top),(28,28,28,255))
              sheet.alpha_composite(legacy,((panel_w-legacy.width)//2,top+(panel_h-legacy.height)//2))
              sheet.alpha_composite(hq,(panel_w+12+(panel_w-hq.width)//2,top+(panel_h-hq.height)//2))
              draw=ImageDraw.Draw(sheet)
              draw.text((6,7),f"symbol {sid}: current 1x -> bilinear 3x",fill=(255,255,255,255))
              draw.text((panel_w+18,7),f"symbol {sid}: SWF 6x -> Lanczos 3x",fill=(255,255,255,255))
              sheet.save(out/f"symbol-{sid}.png")
              probe_info[str(sid)]={
                  "legacy_native_size":[lo.width,lo.height],
                  "temporary_6x_size":[hi6.width,hi6.height],
                  "candidate_3x_size":[hq.width,hq.height],
                  "legacy_visible_bbox":list(lo.getchannel("A").getbbox() or (0,0,0,0)),
                  "candidate_visible_bbox":list(hq.getchannel("A").getbbox() or (0,0,0,0)),
              }

          # The current full logical layer has 168 600x400 tiles, but runtime
          # decodes lazily. Quantify the worst-case cache cost before touching
          # that format so Phase 10 cannot accidentally cross the 500 MiB stop.
          legacy_tile_cache=12*600*400*4
          hq_full_tile_12_cache=12*1800*1200*4
          hq_full_tile_4_cache=4*1800*1200*4
          previous=json.loads(Path(".generated/hq-world-object-asset-report.json").read_text())
          known=previous["combined_known_sprite_rgba_upper_bound"]
          report={
              "level_symbol":152,
              "level_frame0_placement_count":len([p for p in level["placements"] if p.get("frame",0)==0]),
              "candidate_symbols":sorted(wanted),
              "candidate_counts":counts,
              "candidate_depth_ranges":depth_ranges,
              "candidate_placements":placements,
              "probes":probe_info,
              "current_level_tiles":{
                  "count":168,
                  "logical_tile_size":[600,400],
                  "legacy_cache_frames":12,
                  "legacy_cache_rgba_upper_bound":legacy_tile_cache,
              },
              "hypothetical_full_3x_tiles":{
                  "tile_size":[1800,1200],
                  "12_tile_cache_rgba_upper_bound":hq_full_tile_12_cache,
                  "4_tile_cache_rgba_upper_bound":hq_full_tile_4_cache,
                  "known_sprite_upper_bound_before_tiles":known,
                  "known_plus_legacy_plus_hq4":known+legacy_tile_cache+hq_full_tile_4_cache,
                  "known_plus_legacy_plus_hq12":known+legacy_tile_cache+hq_full_tile_12_cache,
                  "hq4_headroom_to_500_mib":500*1024*1024-(known+legacy_tile_cache+hq_full_tile_4_cache),
                  "hq12_headroom_to_500_mib":500*1024*1024-(known+legacy_tile_cache+hq_full_tile_12_cache),
              },
              "decision_gate":"inspect symbol 144-147 probes and preserve internal display depth; do not blindly adopt full 3x tiles",
          }
          Path(".generated/scenery-evaluation-report.json").write_text(json.dumps(report,indent=2))
          assert len(placements)==38, len(placements)
          assert counts=={"144":6,"145":6,"146":14,"147":12}, counts
          assert report["hypothetical_full_3x_tiles"]["known_plus_legacy_plus_hq4"] < 500*1024*1024
          assert report["hypothetical_full_3x_tiles"]["known_plus_legacy_plus_hq12"] < 500*1024*1024
          assert report["hypothetical_full_3x_tiles"]["hq4_headroom_to_500_mib"] > 90*1024*1024
          assert report["hypothetical_full_3x_tiles"]["hq12_headroom_to_500_mib"] < 40*1024*1024
          print(json.dumps(report,indent=2))
          print("Round 10 evaluation PASS: four visible scenery symbols isolated; 4-tile HQ cache has healthy headroom while 12-tile HQ cache is too close to the 500 MiB stop condition for casual adoption.")

      - name: Validate Round 10 selective true-3x scenery layer
        shell: python
        run: |
          import json,struct
          from pathlib import Path
          from PIL import Image,ImageChops

          full_root=Path(".generated/level1a-tiles")
          base_root=Path(".generated/level1a-tiles-hq-base")
          detail1_root=Path(".generated/level1a-detail-tiles-1x")
          detail3_root=Path(".generated/level1a-detail-tiles-hq")

          full=json.loads((full_root/"manifest.json").read_text())
          base=json.loads((base_root/"manifest.json").read_text())
          detail1=json.loads((detail1_root/"manifest.json").read_text())
          detail3=json.loads((detail3_root/"manifest.json").read_text())

          assert full["logical_pixel_scale"] == 1.0
          assert base["logical_pixel_scale"] == 1.0
          assert detail1["logical_pixel_scale"] == 1.0
          assert detail3["logical_pixel_scale"] == 3.0
          assert detail3["supersample"] == 2
          assert detail3["downsample"] == "lanczos"
          assert detail3["alpha_filtering"] == "premultiplied"
          assert detail3["logical_tile_size"] == [600,400]
          assert detail3["tile_size"] == [1800,1200]
          assert full["excluded_symbols"] == [149,151,153]
          assert base["excluded_symbols"] == [144,145,146,149,151,153]
          assert detail1["excluded_symbols"] == [14,147,149,151,153]
          assert detail3["excluded_symbols"] == [14,147,149,151,153]
          for m in (full,base,detail1,detail3):
              assert m["unsupported_fills"] == [], m["unsupported_fills"]
              assert m["missing_ids"] == [], m["missing_ids"]

          def index(manifest):
              return {(x["world_x"],x["world_y"]):x for x in manifest["tiles"]}
          fi,bi,di=index(full),index(base),index(detail1)
          keys=set(fi)|set(bi)|set(di)

          # Depth-safety proof: if the selected 144-146 layer can be drawn
          # above the retained base without changing a single 1x pixel, then
          # moving only that layer to true 3x preserves the original display
          # ordering for every place where the two groups actually overlap.
          changed_tiles=[]
          changed_pixels=0
          for key in sorted(keys):
              original=Image.new("RGBA",(600,400),(0,0,0,0))
              if key in fi:
                  with Image.open(full_root/fi[key]["file"]) as im:
                      original=im.convert("RGBA")
              rebuilt=Image.new("RGBA",(600,400),(0,0,0,0))
              if key in bi:
                  with Image.open(base_root/bi[key]["file"]) as im:
                      rebuilt.alpha_composite(im.convert("RGBA"))
              if key in di:
                  with Image.open(detail1_root/di[key]["file"]) as im:
                      rebuilt.alpha_composite(im.convert("RGBA"))
              diff=ImageChops.difference(original,rebuilt)
              bbox=diff.getbbox()
              if bbox is not None:
                  changed_tiles.append({"tile":list(key),"bbox":list(bbox)})
                  changed_pixels += sum(
                      1 for px in diff.convert("RGBA").getdata()
                      if px != (0,0,0,0)
                  )
          assert not changed_tiles, {
              "changed_tiles":changed_tiles[:20],
              "changed_pixels":changed_pixels,
          }

          raw=Path("assets/level1a_detail_tiles_hq.bin").read_bytes()
          assert raw[:8] == b"BCLVT002"
          assert abs(struct.unpack_from("<f",raw,12)[0]-3.0) < 1e-6
          side=json.loads(Path("assets/level1a_detail_tiles_hq.json").read_text())
          assert side["format"] == "BCLVT002"
          assert abs(side["logical_pixel_scale"]-3.0) < 1e-6
          assert side["tile_count"] == detail3["rendered_tiles"]
          assert all(x["crop_offset"][0]>=0 and x["crop_offset"][1]>=0 for x in side["tiles"])

          # Conservative cache accounting. The HQ path uses a 4-tile cache for
          # both its 1x retained base and 3x selected detail. Include the
          # legacy 12-tile oracle too even though normal HQ play does not fill
          # all three caches simultaneously.
          def top_decoded(sidecar,n):
              sizes=sorted(
                  (x["size"][0]*x["size"][1]*4 for x in sidecar["tiles"]),
                  reverse=True
              )
              return sum(sizes[:n])
          legacy_side=json.loads(Path("assets/level1a_tiles.json").read_text())
          base_side=json.loads(Path("assets/level1a_tiles_hq_base.json").read_text())
          detail_side=side
          legacy_cache=top_decoded(legacy_side,12)
          base_cache=top_decoded(base_side,4)
          detail_cache=top_decoded(detail_side,4)
          previous=json.loads(Path(".generated/hq-world-object-asset-report.json").read_text())
          known=previous["combined_known_sprite_rgba_upper_bound"]
          combined=known+legacy_cache+base_cache+detail_cache
          assert combined < 500*1024*1024, combined

          assets=Path("src/assets.rs").read_text()
          render=Path("src/render.rs").read_text()
          packer=Path("reverse-engineering/tools/pack_level_tiles.py").read_text()
          baker=Path("reverse-engineering/tools/bake_level_tiles.py").read_text()
          for needle in (
              'b"BCLVT001"',
              'b"BCLVT002"',
              "pub logical_pixel_scale: f32",
              "level1a_tiles_hq_base: LevelTileSet",
              "level1a_detail_tiles_hq: LevelTileSet",
              "cache_limit",
          ):
              assert needle in assets, needle
          for needle in (
              "render_backdrop_legacy(base,game,assets)",
              "draw_tiles(base,game,&assets.level1a_tiles_hq_base)",
              "draw_tiles_hq(target,game,&assets.level1a_detail_tiles_hq)",
              "fn draw_tiles_hq",
          ):
              assert needle in render, needle
          for needle in ("MAGIC_V2 = b\"BCLVT002\"","--crop-transparent","<iiiiI"):
              assert needle in packer, needle
          for needle in ("--output-scale","--supersample","--downsample","margin = 2"):
              assert needle in baker, needle

          report={
              "selected_symbols":[144,145,146],
              "retained_low_detail_symbol":147,
              "split_recomposition_exact":True,
              "split_changed_pixels":0,
              "legacy_full_tiles":full["rendered_tiles"],
              "hq_base_tiles":base["rendered_tiles"],
              "hq_detail_tiles":detail3["rendered_tiles"],
              "legacy_pack_bytes":Path("assets/level1a_tiles.bin").stat().st_size,
              "hq_base_pack_bytes":Path("assets/level1a_tiles_hq_base.bin").stat().st_size,
              "hq_detail_pack_bytes":Path("assets/level1a_detail_tiles_hq.bin").stat().st_size,
              "legacy_12_tile_cache_upper_bound":legacy_cache,
              "hq_base_4_tile_cache_upper_bound":base_cache,
              "hq_detail_4_tile_cache_upper_bound":detail_cache,
              "previous_known_sprite_upper_bound":known,
              "combined_known_decoded_upper_bound":combined,
              "headroom_to_500_mib":500*1024*1024-combined,
              "hq_detail_strategy":"symbol152 selected children 144-146, 6x overscan render -> premultiplied Lanczos -> 3x, transparent-cropped BCLVT002",
          }
          Path(".generated/hq-scenery-asset-report.json").write_text(json.dumps(report,indent=2))
          print(json.dumps(report,indent=2))
          print("Round 10 scenery contract PASS: exact 1x split proof + true-3x selected facade/window layer.")

      - name: Validate Round 9 per-monitor DPI-awareness contract
        shell: python
        run: |
          import json
          from pathlib import Path

          src=Path("src/win32.rs").read_text()
          required=[
              "DPI_AWARENESS_CONTEXT_PER_MONITOR_AWARE_V2:isize=-4",
              'GetProcAddress(user32,b"SetProcessDpiAwarenessContext\\0".as_ptr())',
              "SetProcessDPIAware()!=0",
              "fn enable_best_dpi_awareness()->bool",
              "const WM_DPICHANGED:u32=0x02E0",
              "SetWindowPos(hwnd,null_mut(),r.left,r.top,width,height,SWP_NOZORDER|SWP_NOACTIVATE)",
              "fn viewport_for_client(cw:i32,ch:i32)",
              "dpi_scaled_3_by_2_clients_fill_exactly",
              "dpi_scaled_nonmatching_clients_keep_centered_3_by_2_viewport",
              "let _dpi_aware=enable_best_dpi_awareness()",
          ]
          missing=[x for x in required if x not in src]
          if missing:
              raise SystemExit(f"Round 9 DPI source contract missing: {missing}")

          # Model the exact integer viewport helper for representative physical
          # client sizes at Windows 100%, 125% and 150% scaling. Per-monitor-V2
          # means GetClientRect is already in physical pixels, so no extra DPI
          # multiplier is allowed in renderer/game coordinates.
          def viewport(cw,ch):
              cw=max(1,cw); ch=max(1,ch)
              if cw*400 <= ch*600:
                  dw=cw; dh=cw*400//600
              else:
                  dw=ch*600//400; dh=ch
              return ((cw-dw)//2,(ch-dh)//2,dw,dh)

          cases=[
              {"scale_percent":100,"client":[900,600],"expected":[0,0,900,600]},
              {"scale_percent":125,"client":[1125,750],"expected":[0,0,1125,750]},
              {"scale_percent":150,"client":[1350,900],"expected":[0,0,1350,900]},
              {"scale_percent":100,"client":[930,660],"expected":[0,20,930,620]},
              {"scale_percent":125,"client":[1163,825],"expected":[0,25,1163,775]},
              {"scale_percent":150,"client":[1395,990],"expected":[0,30,1395,930]},
          ]
          for case in cases:
              actual=list(viewport(*case["client"]))
              assert actual==case["expected"],(case,actual)
              x,y,w,h=actual
              assert abs(w*2-h*3) <= 1
              assert x>=0 and y>=0
              case["actual"]=actual

          report={
              "preferred_mode":"PER_MONITOR_AWARE_V2",
              "preferred_context":-4,
              "fallback":"SetProcessDPIAware",
              "api_resolution":"dynamic GetProcAddress from user32.dll",
              "monitor_move":"WM_DPICHANGED -> SetWindowPos(suggested RECT)",
              "framebuffer":[1800,1200],
              "logical_stage":[600,400],
              "simulated_viewports":cases,
              "manual_note":"CI validates source contract and physical-pixel viewport math; real multi-monitor DPI transition remains a live Windows presentation check.",
          }
          Path(".generated/dpi-awareness-report.json").write_text(json.dumps(report,indent=2))
          print(json.dumps(report,indent=2))
          print("Round 9 DPI contract PASS: Per-Monitor-V2 preferred, legacy fallback retained, 3:2 viewport stable at 100/125/150%.")

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Run sprite-pack compatibility tests
        run: cargo test --release --target x86_64-pc-windows-msvc

      - name: Build Level 1A fidelity slice
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Smoke-check executable, legacy pixels, HQ output and render timing
        shell: pwsh
        run: |
          $exe = "target/x86_64-pc-windows-msvc/release/batman_cobblebot_native.exe"
          if (!(Test-Path $exe)) { throw "EXE missing" }
          Get-Item $exe | Format-List Name,Length,LastWriteTime
          Get-FileHash $exe -Algorithm SHA256

          $legacy = Start-Process -FilePath $exe -ArgumentList @("--render-smoke", ".generated/visual-smoke") -Wait -PassThru
          if ($legacy.ExitCode -ne 0) { throw "Legacy visual smoke failed with exit code $($legacy.ExitCode)" }

          $hq = Start-Process -FilePath $exe -ArgumentList @("--render-smoke-hq", ".generated/visual-smoke-hq") -Wait -PassThru
          if ($hq.ExitCode -ne 0) { throw "HQ visual smoke failed with exit code $($hq.ExitCode)" }

          $bench = Start-Process -FilePath $exe -ArgumentList @("--benchmark-render", "60", ".generated/render-benchmark.json") -Wait -PassThru
          if ($bench.ExitCode -ne 0) { throw "Render benchmark failed with exit code $($bench.ExitCode)" }

          $legacyShots = Get-ChildItem ".generated/visual-smoke/*.png"
          $hqShots = Get-ChildItem ".generated/visual-smoke-hq/*.png"
          if ($legacyShots.Count -ne 17) { throw "Expected 17 legacy smoke screenshots, got $($legacyShots.Count)" }
          if ($hqShots.Count -ne 17) { throw "Expected 17 HQ smoke screenshots, got $($hqShots.Count)" }
          $legacyShots | Format-Table Name,Length
          $hqShots | Format-Table Name,Length
          Get-Content ".generated/render-benchmark.json"

      - name: Verify Round 2 legacy pixels against renderer-repair baseline
        shell: python
        run: |
          import hashlib
          from pathlib import Path

