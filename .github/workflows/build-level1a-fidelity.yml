          for needle in (
              "draw_batman_hq",
              "upscale_opaque_base(base,target)",
              "draw_foreground_hq(target,game,assets)",
              "True HQ frames are already at final presentation resolution",
          ):
              assert needle in render, needle

          # The baker intentionally uses a common full canvas so all frames
          # share one stable origin while rasterizing. pack_sprite_frames.py
          # then alpha-crops every PNG and rewrites each frame's anchor. Rust
          # decodes those CROPPED records, so the runtime budget must be based
          # on the pack sidecars rather than temporary .generated canvases.
          legacy_pack=json.loads(Path("assets/batman_frames.json").read_text())
          hq_pack=json.loads(Path("assets/batman_frames_hq.json").read_text())
          def packed_decoded_bytes(sidecar):
              return sum(frame["size"][0]*frame["size"][1]*4 for frame in sidecar["frames"])

          report={
              "legacy_pack_bytes":Path("assets/batman_frames.bin").stat().st_size,
              "hq_pack_bytes":Path("assets/batman_frames_hq.bin").stat().st_size,
              "legacy_runtime_decoded_rgba_bytes":packed_decoded_bytes(legacy_pack),
              "hq_runtime_decoded_rgba_bytes":packed_decoded_bytes(hq_pack),
              "legacy_bake_canvas":legacy["size"],
              "hq_bake_canvas":hq["size"],
              "frames":279,
              "output_scale":3,
              "supersample":2,
              "downsample":"lanczos",
          }
          runtime_total=report["legacy_runtime_decoded_rgba_bytes"]+report["hq_runtime_decoded_rgba_bytes"]
          report["combined_runtime_decoded_rgba_bytes"]=runtime_total
          Path(".generated/hq-batman-asset-report.json").write_text(json.dumps(report,indent=2))
          assert runtime_total < 500*1024*1024, report
          print(json.dumps(report,indent=2))
          print("Round 5 asset contract PASS: same 279 timelines, proportional anchors, explicit true-3x pack.")

