      - name: Build Round 10 scenery-detail A-B comparison sheets
        shell: python
        run: |
          import json
          from pathlib import Path
          from PIL import Image,ImageDraw

          lo_root=Path(".generated/level1a-detail-tiles-1x")
          hi_root=Path(".generated/level1a-detail-tiles-hq")
          lo=json.loads((lo_root/"manifest.json").read_text())
          hi=json.loads((hi_root/"manifest.json").read_text())
          hi_by={(x["world_x"],x["world_y"]):x for x in hi["tiles"]}

          scored=[]
          for rec in lo["tiles"]:
              key=(rec["world_x"],rec["world_y"])
              if key not in hi_by:
                  continue
              with Image.open(lo_root/rec["file"]) as im:
                  alpha=im.convert("RGBA").getchannel("A")
                  score=sum(alpha.histogram()[1:])
              scored.append((score,key,rec,hi_by[key]))
          scored.sort(reverse=True,key=lambda x:x[0])
          chosen=scored[:3]
          out=Path(".generated/scenery-hq-comparisons")
          out.mkdir(parents=True,exist_ok=True)
          for rank,(_,key,lrec,hrec) in enumerate(chosen,1):
              with Image.open(lo_root/lrec["file"]) as a0, Image.open(hi_root/hrec["file"]) as b0:
                  a=a0.convert("RGBA").resize((1800,1200),Image.Resampling.BILINEAR)
                  b=b0.convert("RGBA")
              sheet=Image.new("RGBA",(3612,1234),(28,28,28,255))
              sheet.alpha_composite(a,(0,34))
              sheet.alpha_composite(b,(1812,34))
              draw=ImageDraw.Draw(sheet)
              draw.text((8,8),f"tile {key}: current 1x detail -> bilinear 3x",fill=(255,255,255,255))
              draw.text((1820,8),f"tile {key}: true SWF 6x -> Lanczos 3x",fill=(255,255,255,255))
              sheet.save(out/f"{rank:02d}_x{key[0]:+07d}_y{key[1]:+07d}.png")
          assert len(list(out.glob("*.png"))) == min(3,len(scored))
          print("Built Round-10 scenery detail A/B sheets for", [x[1] for x in chosen])

